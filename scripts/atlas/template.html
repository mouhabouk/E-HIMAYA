<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أطلس ء-حماية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: an atlas of the dashboard. A sticky control bar (screen picker, previous/next, listen), then for the chosen
   screen: its identity strip with scope badges, the flowchart beside the screenshot (a box lights its region), and
   the cards (purpose and value, functional, technical, who opens it). Tokens from docs/design-system.md. */
:root{
  --page:#F6F8FC;--card:#FFFFFF;--line:#E3E7EF;--ink:#182038;--muted:#5B6478;--brand:#1F3FA0;--brand-tint:#E8EDFA;
  --gold:#C9A24A;--hi:#F08C00;--shade:rgba(11,26,63,.55);
  --c-central:#1F3FA0;--b-central:#E8EDFA;--c-regional:#00695A;--b-regional:#E0F3EF;--c-room_commander:#7A4B00;--b-room_commander:#FFF3D6;
  --c-commander:#C25E00;--b-commander:#FFF0E0;--c-agents:#5E2A80;--b-agents:#F2EAF8;--c-admin:#B3121A;--b-admin:#FDE8E8;
  --f:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;--fd:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;--fm:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0E1426;--card:#161E35;--line:#26304D;--ink:#E8ECF5;--muted:#A6AFC4;--brand:#8FA8FF;--brand-tint:#1D2850;--hi:#FFA733;
  --c-central:#8FA8FF;--b-central:#1D2850;--c-regional:#4DD0B8;--b-regional:#123630;--c-room_commander:#FFC933;--b-room_commander:#3A2E0E;--c-commander:#FFA733;--b-commander:#3A2610;--c-agents:#C49BE6;--b-agents:#2D2040;--c-admin:#FF6B6B;--b-admin:#3D1A1F;color-scheme:dark}}
:root[data-theme="dark"]{--page:#0E1426;--card:#161E35;--line:#26304D;--ink:#E8ECF5;--muted:#A6AFC4;--brand:#8FA8FF;--brand-tint:#1D2850;--hi:#FFA733;
  --c-central:#8FA8FF;--b-central:#1D2850;--c-regional:#4DD0B8;--b-regional:#123630;--c-room_commander:#FFC933;--b-room_commander:#3A2E0E;--c-commander:#FFA733;--b-commander:#3A2610;--c-agents:#C49BE6;--b-agents:#2D2040;--c-admin:#FF6B6B;--b-admin:#3D1A1F;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0B1A3F}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#0B1A3F;color:#F2F5FC;border-bottom:3px solid var(--gold)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-block:10px}
.brandname{font-family:var(--fd);font-size:22px;font-weight:700;margin-inline-end:auto}
.brandname small{font-family:var(--f);font-size:12.5px;font-weight:400;color:#C3CBE0;margin-inline-start:8px}
select#pick{font:inherit;font-size:14.5px;max-width:min(520px,100%);min-width:0;padding:8px 12px;border-radius:10px;border:1px solid #2A3A6B;background:#12224D;color:#FFFFFF}
.bar button{font:inherit;font-size:14px;cursor:pointer;border:1px solid #2A3A6B;background:#12224D;color:#F2F5FC;border-radius:999px;padding:7px 14px}
.bar button.listen{background:var(--gold);border-color:var(--gold);color:#1B1405;font-weight:700}
.bar button[aria-pressed="true"]{outline:2px solid #FFFFFF}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
main{padding-block:18px 40px}
.id{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end;justify-content:space-between;margin-bottom:14px}
.crumb{font-size:13px;color:var(--muted)}
h1{font-family:var(--fd);font-weight:500;font-size:clamp(24px,3.2vw,34px);margin:2px 0 0;text-wrap:balance}
.route{font-family:var(--fm);font-size:12.5px;color:var(--brand);direction:ltr;display:inline-block}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;color:var(--c);background:var(--b);border:1px solid var(--c)}
.grid{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:18px;align-items:start}
.flowbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;overflow-x:auto}
.flowbox h2,.cards h2{font-size:14px;color:var(--muted);font-weight:600;margin:4px 6px 8px}
svg.flow{display:block;width:100%;height:auto}
.n{cursor:pointer}
.n .sh{fill:var(--card);stroke:var(--brand);stroke-width:1.8}
.n.dec .sh{stroke:var(--gold)} .n.term .sh{stroke:var(--muted)} .n.io .sh{stroke:#00806A}
.n text{fill:var(--ink);font-family:var(--f);font-size:13.5px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.n text.s{font-size:11px;font-weight:400;fill:var(--muted)}
.n.nolink{cursor:default}
.n.on .sh{fill:var(--hi);stroke:var(--hi)} .n.on text{fill:#1B1405}
.n:not(.nolink):hover .sh{stroke-width:3}
.e{stroke:var(--line);stroke-width:2;fill:none}
.shotbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;min-width:0}
.shotwrap{position:relative;max-height:calc(100vh - 190px);overflow:auto;border-radius:10px;border:1px solid var(--line);direction:ltr}
.shotwrap img{display:block;width:100%;height:auto;max-width:none}
.shotwrap .inner{position:relative;width:100%}
.zbar{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.zbar button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:17px;cursor:pointer;padding:0}
.zbar button:hover{border-color:var(--hi)}
.zbar button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.zbar span{font-size:12.5px;color:var(--mute)}
.spot{position:absolute;border:3px solid var(--hi);border-radius:10px;box-shadow:0 0 0 9999px var(--shade);transition:all .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.spot[hidden]{display:none}
.spot b{position:absolute;top:-30px;inset-inline-start:-3px;background:var(--hi);color:#1B1405;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:8px;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
.spot.pulse{animation:pulse 1.2s ease-out 2}
@keyframes pulse{0%{outline:0 solid var(--hi)}100%{outline:14px solid transparent}}
.hint{font-size:12.5px;color:var(--muted);margin:8px 4px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.card p{margin:0 0 8px}
.card .val{border-inline-start:3px solid var(--gold);padding-inline-start:10px}
.card ul{margin:0;padding-inline-start:18px}
.card li{margin-bottom:3px}
.mono{font-family:var(--fm);font-size:12px;direction:ltr;text-align:left;unicode-bidi:plaintext}
.api{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.api td{overflow-wrap:anywhere;word-break:break-word}
.api td:first-child{width:56px}
.api td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
.verb{font-family:var(--fm);font-weight:700;font-size:11px}
.who{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.who .y{color:var(--c-regional);font-weight:700}.who .no{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
footer{color:var(--muted);font-size:12.5px;padding-block:18px;border-top:1px solid var(--line)}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}.shotbox{position:static}.shotwrap{max-height:none}}
@media (prefers-reduced-motion:reduce){.spot{transition:none}.spot.pulse{animation:none}}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <div class="brandname">أطلس ء-حماية<small id="sub"></small></div>
  <label for="pick" class="crumb" style="color:#C3CBE0">الصفحة</label>
  <select id="pick"></select>
  <button type="button" id="prev" aria-label="الصفحة السابقة">→ السابقة</button>
  <button type="button" id="next" aria-label="الصفحة التالية">التالية ←</button>
  <button type="button" class="listen" id="listen" aria-pressed="false">🔊 استمع</button>
  <button type="button" id="auto" aria-pressed="false" title="يتنقل بين مربعات المخطط ويقرأها">▶ جولة</button>
</div></header>
<main class="wrap">
  <div class="legend" id="legend"></div>
  <div class="id">
    <div><div class="crumb" id="crumb"></div><h1 id="title"></h1><span class="route" id="route"></span></div>
    <div class="badges" id="badges"></div>
  </div>
  <div class="grid">
    <section class="flowbox" aria-label="المخطط الانسيابي"><h2>المخطط الانسيابي · اضغط مربعا</h2><svg class="flow" id="flow" role="img" aria-label="المخطط الانسيابي للصفحة"></svg></section>
    <section class="shotbox" aria-label="لقطة الشاشة"><div class="zbar" role="toolbar" aria-label="تكبير اللقطة"><button type="button" id="zin" aria-label="تكبير">+</button><button type="button" id="zout" aria-label="تصغير">−</button><button type="button" id="zhome" aria-label="اللقطة كاملة">⌂</button><span id="zlbl">100٪ · الضغط على مربع يكبّر موضعه</span></div><div class="shotwrap" id="shotwrap"><div class="inner" id="shotin"><img id="shot" alt=""><div class="spot" id="spot" hidden><b id="spotlabel"></b></div></div></div>
      <p class="hint" id="hint">لقطة حقيقية من المنظومة بمعطيات [SIM]، بحساب مدير النظام.</p></section>
  </div>
  <div class="cards">
    <article class="card"><h2>الغرض والقيمة المضافة</h2><p id="purpose"></p><p class="val" id="value"></p></article>
    <article class="card"><h2>الجانب الوظيفي: ما في الصفحة</h2><ul id="func"></ul></article>
    <article class="card"><h2>من يفتح هذه الصفحة</h2><div class="who" id="who"></div><p class="hint">جُرّب كل دور فعليا على المنظومة. الجهوي: ولاية صفاقس.</p></article>
    <article class="card"><h2>الجانب التقني</h2><p class="mono" id="files"></p><table class="api" id="api"></table><p class="hint" id="tables"></p></article>
  </div>
</main>
<footer class="wrap" id="foot"></footer>
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);const BASE="__BASE__";
const SC={central:'مركزي',regional:'جهوي',room_commander:'جهوي: القاعة والقائد',commander:'القائد الميداني',agents:'بقية الأعوان والمصالح',admin:'مدير النظام وحده'};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NS='http://www.w3.org/2000/svg';const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
$('sub').textContent=`${D.meta.surface} · ${D.meta.count} صفحة · ${D.meta.built}`;
$('legend').innerHTML=Object.entries(SC).map(([k,v])=>`<span class="badge" style="--c:var(--c-${k});--b:var(--b-${k})">${v}</span>`).join('');
// picker grouped by menu group
const groups=[];D.screens.forEach((s,i)=>{let g=groups.find(x=>x.k===s.gkey);if(!g){g={k:s.gkey,n:s.group,i:[]};groups.push(g)}g.i.push(i)});
$('pick').innerHTML=groups.map(g=>`<optgroup label="${esc(g.n)}">${g.i.map(i=>{const s=D.screens[i];return `<option value="${i}">${s.detail?'↳ ':''}${esc(s.item)}  ${s.scope.map(x=>x==='admin'?'●':'').join('')}</option>`}).join('')}</optgroup>`).join('');
if(D.meta.single){$('pick').disabled=true;$('prev').hidden=true;$('next').hidden=true}
let cur=0,sel=null,tour=null;
// speech
const synth=window.speechSynthesis;let voice=null;
function pickVoice(){const v=synth?synth.getVoices():[];voice=v.find(x=>/^ar/i.test(x.lang))||null}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
function say(text,done){if(!synth){$('hint').textContent='هذا المتصفح لا يدعم القراءة الصوتية.';done&&done();return}synth.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';if(voice)u.voice=voice;u.rate=0.95;u.onend=()=>{done&&done()};u.onerror=()=>{done&&done()};synth.speak(u);if(!voice)$('hint').textContent='لم يُعثر على صوت عربي في هذا الجهاز؛ قد تُقرأ بصوت آخر. ثبّت صوتا عربيا من إعدادات النظام.'}
function whoText(s){const yes=Object.entries(D.meta.personas).filter(([k])=>k==='admin'||s.access[k]).map(([,v])=>v);return yes.join('، ')}
function screenText(s){return `${s.item}. ضمن ${s.group}. ${s.purpose} القيمة المضافة: ${s.value} يفتح هذه الصفحة: ${whoText(s)}.`}
function nodeText(s,n){const r=n.r!=null?s.regions[n.r]:null;return `${n.l}. ${n.s?n.s+'.':''} ${r&&r.kind==='section'?'قسم في الصفحة.':''}`}
// render
function render(i){cur=(i+D.screens.length)%D.screens.length;const s=D.screens[cur];$('pick').value=String(cur);
  try{history.replaceState(null,'','#'+s.id)}catch(e){}
  $('crumb').textContent=`${s.group} › ${s.item}`;$('title').textContent=s.title;$('route').textContent=s.path||s.route;
  $('badges').innerHTML=s.scope.map(k=>`<span class="badge" style="--c:var(--c-${k});--b:var(--b-${k})">${SC[k]}</span>`).join('');
  $('purpose').textContent=s.purpose;$('value').textContent='القيمة المضافة: '+s.value;
  $('func').innerHTML=s.regions.filter(r=>r.kind!=='menu').map((r,k)=>`<li><b>${({title:'العنوان',lead:'التعريف',tabs:'تبويبات',map:'خريطة',section:'قسم',table:'جدول',form:'استمارة',action:'زر'})[r.kind]||r.kind}:</b> ${esc(r.label)}</li>`).join('')||'<li>صفحة عرض.</li>';
  $('who').innerHTML=Object.entries(D.meta.personas).map(([k,v])=>{const ok=k==='admin'||s.access[k];return `<span>${v}</span><span class="${ok?'y':'no'}">${ok?'✓ تفتحها':'—'}</span>`}).join('');
  $('files').innerHTML=`${esc(s.page)}${s.components.length?'<br>'+s.components.map(esc).join('<br>'):''}`;
  $('api').innerHTML=s.api.slice(0,24).map(a=>`<tr><td class="verb">${a.verb}</td><td class="mono">${esc(a.path)}</td><td class="mono">${esc(a.tables.join(', '))}</td></tr>`).join('')||'<tr><td>لا نداء مباشر للخادم من هذه الصفحة.</td></tr>';
  $('tables').textContent=s.tables.length?`الجداول: ${s.tables.length} (${s.tables.slice(0,10).join('، ')}${s.tables.length>10?'…':''})`:'';
  $('shot').src=BASE+s.shot;$('shot').alt='لقطة شاشة: '+s.title;$('spot').hidden=true;sel=null;setZoom(1,true);
  drawFlow(s);$('foot').textContent=`بُني آليا من المستودع والمنظومة يوم ${D.meta.built} (scripts/atlas). اللقطة بمعطيات [SIM].`}
function drawFlow(s){const svg=$('flow');svg.innerHTML='';const W=400,gap=84;const nodes=s.flow;svg.setAttribute('viewBox',`0 0 ${W} ${nodes.length*gap+20}`);
  nodes.forEach((n,k)=>{if(k)el('line',{x1:W/2,y1:(k-1)*gap+40+30,x2:W/2,y2:k*gap+40-30,class:'e','marker-end':'url(#ah)'},svg)});
  const d=el('defs',{},svg);const m=el('marker',{id:'ah',viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'7',markerHeight:'7',orient:'auto'},d);el('path',{d:'M0,0L10,5L0,10z',fill:'#8A93A8'},m);
  nodes.forEach((n,k)=>{const y=k*gap+40,x=W/2;const g=el('g',{class:`n ${n.t}${n.r==null?' nolink':''}`,tabindex:'0',role:'button','aria-label':n.l},svg);
    const w=n.t==='dec'?250:300,h=n.t==='dec'?64:52;
    if(n.t==='term')el('rect',{x:x-w/2,y:y-h/2,width:w,height:h,rx:h/2,class:'sh'},g);
    else if(n.t==='proc')el('rect',{x:x-w/2,y:y-h/2,width:w,height:h,rx:8,class:'sh'},g);
    else if(n.t==='io')el('polygon',{points:`${x-w/2+16},${y-h/2} ${x+w/2+6},${y-h/2} ${x+w/2-16},${y+h/2} ${x-w/2-6},${y+h/2}`,class:'sh'},g);
    else el('polygon',{points:`${x},${y-h/2} ${x+w/2},${y} ${x},${y+h/2} ${x-w/2},${y}`,class:'sh'},g);
    const t=el('text',{x,y:n.s?y-8:y},g);t.textContent=n.l.length>40?n.l.slice(0,39)+'…':n.l;
    if(n.s){const t2=el('text',{x,y:y+11,class:'s'},g);t2.textContent=n.s.length>48?n.s.slice(0,47)+'…':n.s}
    const go=()=>{select(k,true)};g.addEventListener('click',go);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})})}
let zoom=1;
function setZoom(z,quiet){const wrap=$('shotwrap'),img=$('shot');const cx=(wrap.scrollLeft+wrap.clientWidth/2)/Math.max(img.clientWidth,1),cy=(wrap.scrollTop+wrap.clientHeight/2)/Math.max(img.clientHeight,1);
  zoom=Math.min(4,Math.max(1,z));$('shotin').style.width=(zoom*100)+'%';$('zlbl').textContent=Math.round(zoom*100)+'٪'+(zoom===1?' · الضغط على مربع يكبّر موضعه':'');
  if(!quiet){wrap.scrollLeft=cx*img.clientWidth-wrap.clientWidth/2;wrap.scrollTop=cy*img.clientHeight-wrap.clientHeight/2}
  if(sel!=null&&!quiet){const s=D.screens[cur],n=s.flow[sel],r=n.r!=null?s.regions[n.r]:null;if(r){const sc=img.clientWidth/img.naturalWidth;Object.assign($('spot').style,{transition:'none',left:(r.x*sc-4)+'px',top:(r.y*sc-4)+'px',width:(r.w*sc+8)+'px',height:(r.h*sc+8)+'px'});requestAnimationFrame(()=>$('spot').style.transition='')}}}
function select(k,speak,done){const s=D.screens[cur];const n=s.flow[k];sel=k;document.querySelectorAll('#flow .n').forEach((g,j)=>g.classList.toggle('on',j===k));
  const r=n.r!=null?s.regions[n.r]:null;const img=$('shot'),spot=$('spot');
  if(r&&img.naturalWidth){setZoom(Math.min(2.6,Math.max(1,.8*img.naturalWidth/Math.max(r.w,1))),true);const sc=img.clientWidth/img.naturalWidth;spot.hidden=false;Object.assign(spot.style,{left:(r.x*sc-4)+'px',top:(r.y*sc-4)+'px',width:(r.w*sc+8)+'px',height:(r.h*sc+8)+'px'});$('spotlabel').textContent=n.l;
    spot.classList.remove('pulse');void spot.offsetWidth;spot.classList.add('pulse');const wrap=$('shotwrap');wrap.scrollTo({top:Math.max(0,r.y*sc-80),left:Math.max(0,(r.x+r.w/2)*sc-wrap.clientWidth/2),behavior:'smooth'})}else spot.hidden=true;
  if(speak)say(nodeText(s,n),done);else done&&done()}
$('pick').addEventListener('change',e=>{stopTour();render(+e.target.value)});
$('zin').onclick=()=>setZoom(zoom*1.3);$('zout').onclick=()=>setZoom(zoom/1.3);$('zhome').onclick=()=>{setZoom(1,true);$('shotwrap').scrollTo({top:0,left:0,behavior:'smooth'});if(sel!=null){const s=D.screens[cur],r=s.regions[s.flow[sel].r];if(r){const img=$('shot'),sc=img.clientWidth/img.naturalWidth;Object.assign($('spot').style,{left:(r.x*sc-4)+'px',top:(r.y*sc-4)+'px',width:(r.w*sc+8)+'px',height:(r.h*sc+8)+'px'})}}};
$('prev').onclick=()=>{stopTour();render(cur-1)};$('next').onclick=()=>{stopTour();render(cur+1)};
$('listen').onclick=()=>{stopTour();say(screenText(D.screens[cur]))};
function stopTour(){tour=null;$('auto').setAttribute('aria-pressed','false');$('auto').textContent='▶ جولة';synth&&synth.cancel()}
$('auto').onclick=()=>{if(tour){stopTour();return}tour={k:-1};$('auto').setAttribute('aria-pressed','true');$('auto').textContent='❚❚ إيقاف';const s=D.screens[cur];
  const step=()=>{if(!tour)return;tour.k++;if(tour.k>=s.flow.length){stopTour();return}select(tour.k,true,()=>setTimeout(step,400))};say(screenText(s),()=>setTimeout(step,300))};
window.addEventListener('resize',()=>{if(sel!=null)select(sel,false)});
$('shot').addEventListener('load',()=>{if(sel!=null)select(sel,false)});
const h=location.hash.slice(1);const start=Math.max(0,D.screens.findIndex(s=>s.id===h));render(start);
window.addEventListener('hashchange',()=>{const j=D.screens.findIndex(s=>s.id===location.hash.slice(1));if(j>=0&&j!==cur)render(j)});
})();
</script>
</body>
