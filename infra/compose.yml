# ء-حماية / e-Himaya — البنية الأساسية للتطوير والتجربة (المراحل 1 إلى 5)
# Usage (from repo root):  docker compose --env-file .env -f infra/compose.yml up -d
# With the AI layer (downloads the models once, several GB):
#   docker compose --env-file .env -f infra/compose.yml --profile ai up -d
# On a GPU server add: -f infra/compose.gpu.yml
# Live streaming (phase 6, docs/streaming.md): MediaMTX always runs; add --profile sim for the simulated camera
# (stream-sim) and --profile vision for the fire/smoke detector (set VISION_SERVICE_URL=http://vision:8100).
name: ehimaya

x-restart: &restart
  restart: unless-stopped

# Images are pinned by digest (the tag is kept for readability); Dependabot proposes updates (.github/dependabot.yml).

services:
  postgres:
    <<: *restart
    build: ./postgres
    image: ehimaya/postgres:17-postgis-pgvector
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      EHIMAYA_DB_NAME: ${EHIMAYA_DB_NAME:-ehimaya}
      EHIMAYA_DB_USER: ${EHIMAYA_DB_USER:-ehimaya}
      EHIMAYA_DB_PASSWORD: ${EHIMAYA_DB_PASSWORD:?set EHIMAYA_DB_PASSWORD}
      # Runtime role of the API (DML only, append-only audit); the owner above runs the migrations.
      EHIMAYA_DB_RUNTIME_USER: ${EHIMAYA_DB_RUNTIME_USER:-ehimaya_app}
      EHIMAYA_DB_RUNTIME_PASSWORD: ${EHIMAYA_DB_RUNTIME_PASSWORD:-${EHIMAYA_DB_PASSWORD}}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${EHIMAYA_DB_NAME:-ehimaya}"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot, idempotent: (re)creates the API runtime role with the superuser, so volumes created before the role
  # existed are upgraded on the next `up` (infra/postgres/ehimaya-roles.sh).
  db-roles:
    image: ehimaya/postgres:17-postgis-pgvector
    restart: "no"
    entrypoint: ["/usr/local/bin/ehimaya-roles.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      EHIMAYA_DB_NAME: ${EHIMAYA_DB_NAME:-ehimaya}
      EHIMAYA_DB_USER: ${EHIMAYA_DB_USER:-ehimaya}
      EHIMAYA_DB_RUNTIME_USER: ${EHIMAYA_DB_RUNTIME_USER:-ehimaya_app}
      EHIMAYA_DB_RUNTIME_PASSWORD: ${EHIMAYA_DB_RUNTIME_PASSWORD:-${EHIMAYA_DB_PASSWORD}}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
    depends_on:
      postgres:
        condition: service_healthy

  valkey:
    <<: *restart
    image: valkey/valkey:8.1-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:?set VALKEY_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$${VALKEY_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

  nats:
    <<: *restart
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_APP_USER: ${NATS_APP_USER:-ehimaya}
      NATS_APP_PASSWORD: ${NATS_APP_PASSWORD:?set NATS_APP_PASSWORD}
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - natsdata:/data
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for media and evidence (Apache-2.0)
  seaweedfs:
    <<: *restart
    image: chrislusf/seaweedfs:3.97@sha256:bb05d66d2963b1cc48073190781c3dd29e2c4c88a2ae2986bf58e38c86d89c6e
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sed -e "s|\$${S3_ACCESS_KEY}|$${S3_ACCESS_KEY}|" -e "s|\$${S3_SECRET_KEY}|$${S3_SECRET_KEY}|"
        /etc/seaweedfs/s3.json.template > /tmp/s3.json &&
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
        -master.volumeSizeLimitMB=1024 -volume.max=0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - ./seaweedfs/s3.json.template:/etc/seaweedfs/s3.json.template:ro
      - s3data:/data
    ports:
      - "127.0.0.1:8333:8333"

  # One-shot: create the media bucket (the API's S3 identity has no admin rights).
  seaweedfs-init:
    image: chrislusf/seaweedfs:3.97@sha256:bb05d66d2963b1cc48073190781c3dd29e2c4c88a2ae2986bf58e38c86d89c6e
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for i in $$(seq 1 60); do
        echo "s3.bucket.create -name $${S3_BUCKET_MEDIA}" | weed shell -master=seaweedfs:9333 2>&1 | grep -q "created bucket" && exit 0;
        sleep 2;
        done; echo "bucket creation failed"; exit 1
    environment:
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-ehimaya-media}
    depends_on:
      - seaweedfs

  # Resumable uploads (tus 1.0) straight to S3; every upload is authorized by the API through hooks.
  tusd:
    <<: *restart
    image: tusproject/tusd:v2.8.0@sha256:060f117d224d057a5f25be79b4a4535168a0901515cc20cd02f62d0b8e623f5f
    command:
      - -host=0.0.0.0
      - -port=1080
      - -base-path=/api/v1/uploads/
      - -s3-bucket=${S3_BUCKET_MEDIA:-ehimaya-media}
      - -s3-endpoint=http://seaweedfs:8333
      - -s3-object-prefix=uploads/
      - -disable-download
      - -max-size=314572800
      # The hook secret travels in the Authorization header (Go sends URL user info as HTTP Basic), not in the
      # path. Client headers are not forwarded: the API reads them from the hook event body.
      - -hooks-http=http://tusd:${TUSD_HOOK_SECRET:?set TUSD_HOOK_SECRET}@api:8000/internal/tusd/hooks
      - -hooks-enabled-events=pre-create,post-finish,post-terminate
      - -cors-allow-origin=${TUSD_CORS_ORIGIN_REGEX:-^http://localhost:517[34]$$}
      - -cors-allow-headers=Authorization,X-Device-Key
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: us-east-1
    ports:
      - "127.0.0.1:1080:1080"
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully

  keycloak:
    <<: *restart
    image: keycloak/keycloak:26.3@sha256:357829ec7c4693397533035092ad13b0644bcc95ded311f33a3738c4d9e9bdba
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8080}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *restart
    build:
      context: ../services/api
    image: ehimaya/api:dev
    environment:
      # Runtime role: no DDL, no TRUNCATE, audit.log append-only. Migrations run in the `migrate` service below.
      DATABASE_URL: postgresql+asyncpg://${EHIMAYA_DB_RUNTIME_USER:-ehimaya_app}:${EHIMAYA_DB_RUNTIME_PASSWORD:-${EHIMAYA_DB_PASSWORD}}@postgres:5432/${EHIMAYA_DB_NAME:-ehimaya}
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      NATS_URL: nats://${NATS_APP_USER:-ehimaya}:${NATS_APP_PASSWORD}@nats:4222
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-ehimaya-media}
      # Pre-signed media links opened by the dashboard in the browser.
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
      # Issuer = public URL in tokens; JWKS fetched over the internal network.
      OIDC_ISSUERS: ${KEYCLOAK_HOSTNAME:-http://localhost:8080}/realms/ehimaya-public,${KEYCLOAK_HOSTNAME:-http://localhost:8080}/realms/ehimaya-staff
      OIDC_JWKS_BASE_URL: http://keycloak:8080
      OIDC_AUDIENCE: ehimaya-api
      ANON_PSEUDONYM_SECRET: ${ANON_PSEUDONYM_SECRET:?set ANON_PSEUDONYM_SECRET}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY}
      # Key rotation (A5): extra key versions "2:<base64>,…" and the version new values are written with.
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:-}
      FIELD_ENCRYPTION_ACTIVE_VERSION: ${FIELD_ENCRYPTION_ACTIVE_VERSION:-}
      TUSD_HOOK_SECRET: ${TUSD_HOOK_SECRET}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      # development | production (infra/compose.prod.yml): production hides /docs and refuses example secrets.
      APP_ENV: ${APP_ENV:-development}
      # all = HTTP + background loops in one container (development); production splits api / worker.
      PROCESS_ROLE: ${PROCESS_ROLE:-all}
      # Proxies whose X-Forwarded-For is trusted (uvicorn). Development: none in front of the API.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Anonymous abuse controls (A1); defaults in services/api/app/core/config.py.
      ANON_IDENTITY_PER_IP: ${ANON_IDENTITY_PER_IP:-60}
      ANON_IDENTITY_WINDOW_S: ${ANON_IDENTITY_WINDOW_S:-3600}
      ANON_REPORT_PER_IP: ${ANON_REPORT_PER_IP:-60}
      ANON_REPORT_WINDOW_S: ${ANON_REPORT_WINDOW_S:-600}
      ANON_CONSENT_PER_IP: ${ANON_CONSENT_PER_IP:-60}
      ANON_DEVICE_PER_IP: ${ANON_DEVICE_PER_IP:-120}
      ANON_REPORT_BUDGET: ${ANON_REPORT_BUDGET:-300}
      ANON_REPORT_BUDGET_WINDOW_S: ${ANON_REPORT_BUDGET_WINDOW_S:-600}
      # Retention and anonymisation (A6), run by the background loops; durations in days.
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      RETENTION_INTERVAL_S: ${RETENTION_INTERVAL_S:-3600}
      RETENTION_EVENTS_DAYS: ${RETENTION_EVENTS_DAYS:-7}
      RETENTION_NOTIFY_OUTBOX_DAYS: ${RETENTION_NOTIFY_OUTBOX_DAYS:-30}
      RETENTION_NOTIFY_DISPATCH_DAYS: ${RETENTION_NOTIFY_DISPATCH_DAYS:-180}
      RETENTION_DEVICE_DAYS: ${RETENTION_DEVICE_DAYS:-180}
      RETENTION_DEVICE_LOCATION_DAYS: ${RETENTION_DEVICE_LOCATION_DAYS:-30}
      RETENTION_REPORT_DAYS: ${RETENTION_REPORT_DAYS:-1826}
      RETENTION_CONSENT_DAYS: ${RETENTION_CONSENT_DAYS:-1826}
      RETENTION_ANON_ACCOUNT_DAYS: ${RETENTION_ANON_ACCOUNT_DAYS:-365}
      RETENTION_ERASURE_DAYS: ${RETENTION_ERASURE_DAYS:-30}
      # Institutions portal (phase 4): invitation and certificate verification links, certificate signing.
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-http://localhost:5174}
      CERTIFICATE_SIGNING_KEY: ${CERTIFICATE_SIGNING_KEY:-}
      # AI layer (profile "ai"). Unset: reports are still scored and grouped by the rules.
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      # Notification channels (phase 5). An empty channel is recorded as skipped; the others still go out.
      # E-mail goes to Mailpit by default (development): every message is visible at http://localhost:8025.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-e-Himaya <no-reply@ehimaya.tn>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      # ┏━━ SIMULATION ━━ push and SMS go to notify-sim (emulated FCM HTTP v1 + OAuth, Tunisian SMS gateway)
      # ┃ PRODUCTION: in .env set FCM_SERVICE_ACCOUNT=<base64 -w0 of the key from Firebase console > Project settings >
      # ┃   Service accounts > Generate new private key> (it wins over FCM_SERVICE_ACCOUNT_FILE),
      # ┃   FCM_API_URL=https://fcm.googleapis.com, SMS_HTTP_URL and SMS_HTTP_TOKEN from the SMS provider contract;
      # ┃   then delete the notify-sim service, the volume line and depends_on entry below and the notifysim volume.
      # ┗━━━━━━━━━━━━━━━━
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-/run/notify-sim/fcm-service-account.json}
      FCM_API_URL: ${FCM_API_URL:-http://notify-sim:8090}
      SMS_HTTP_URL: ${SMS_HTTP_URL:-http://notify-sim:8090/sms/send}
      SMS_HTTP_TOKEN: ${SMS_HTTP_TOKEN:-sim-sms-token}
      SMS_SENDER: ${SMS_SENDER:-E-HIMAYA}
      # Live streaming (phase 6, docs/streaming.md). MediaMTX asks the API who may publish/read (/internal/mediamtx/auth)
      # and posts path events with MEDIAMTX_HOOK_TOKEN; the API kicks publishers through the MediaMTX API.
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_API_PASSWORD: ${MEDIAMTX_API_PASSWORD:?set MEDIAMTX_API_PASSWORD}
      MEDIAMTX_HOOK_TOKEN: ${MEDIAMTX_HOOK_TOKEN:?set MEDIAMTX_HOOK_TOKEN}
      # Addresses handed to clients: WHIP/WHEP and HLS base URLs, host of the RTSP/RTMP URLs given to drones/cameras.
      STREAM_WEBRTC_PUBLIC_URL: ${STREAM_WEBRTC_PUBLIC_URL:-http://localhost:8889}
      STREAM_HLS_PUBLIC_URL: ${STREAM_HLS_PUBLIC_URL:-http://localhost:8888}
      STREAM_INGEST_HOST: ${STREAM_INGEST_HOST:-localhost}
      STREAM_RECORDINGS_DIR: /recordings
      STREAM_MAX_DURATION_S: ${STREAM_MAX_DURATION_S:-900}
      STREAM_CREATE_PER_HOUR: ${STREAM_CREATE_PER_HOUR:-6}
      RETENTION_STREAM_DAYS: ${RETENTION_STREAM_DAYS:-365}
      # SIMULATION: token of stream-sim (profile "sim") for /internal/sim/streams. PRODUCTION: empty (refused).
      STREAM_SIM_TOKEN: ${STREAM_SIM_TOKEN:-}
      # Fire/smoke detector (profile "vision"). Empty VISION_SERVICE_URL: streams and uploads work without detection.
      VISION_SERVICE_URL: ${VISION_SERVICE_URL:-}
      VISION_API_TOKEN: ${VISION_API_TOKEN:-}
      VISION_CALLBACK_TOKEN: ${VISION_CALLBACK_TOKEN:-}
      VISION_READ_PASSWORD: ${VISION_READ_PASSWORD:-}
      VISION_MIN_CONFIDENCE: ${VISION_MIN_CONFIDENCE:-0.45}
      VISION_ALERT_CONFIDENCE: ${VISION_ALERT_CONFIDENCE:-0.6}
    volumes:
      # SIMULATION: the service account generated by notify-sim (read-only). PRODUCTION: remove this line.
      - notifysim:/run/notify-sim:ro
      # Finished recording segments written by MediaMTX: hashed, stored in S3, then deleted by the worker loops.
      - recordings:/recordings
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
      # SIMULATION: remove in production together with the notify-sim service.
      notify-sim:
        condition: service_healthy

  # One-shot: database migrations as the owner role, then the runtime role's grants (services/api/migrations/env.py).
  # Same image and settings as the api; `docker compose run --rm migrate` re-runs it by hand.
  migrate:
    extends: api
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${EHIMAYA_DB_USER:-ehimaya}:${EHIMAYA_DB_PASSWORD}@postgres:5432/${EHIMAYA_DB_NAME:-ehimaya}
      DB_RUNTIME_ROLE: ${EHIMAYA_DB_RUNTIME_USER:-ehimaya_app}
    ports: !reset []
    volumes: !reset []
    healthcheck:
      disable: true
    depends_on: !override
      db-roles:
        condition: service_completed_successfully

  # Development mail catcher (MIT): receives every e-mail the API sends; web UI on http://localhost:8025.
  # In production point SMTP_HOST at the real relay instead.
  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    environment:
      MP_MAX_MESSAGES: 5000
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  # ┏━━ SIMULATION ━━ notify-sim: emulates Firebase Cloud Messaging HTTP v1 (OAuth service-account flow) and the HTTP
  # ┃   SMS gateway of a Tunisian operator. Inbox of every push and SMS: http://localhost:8090. Dev/test only.
  # ┃ PRODUCTION: delete this service and the notifysim volume; in .env set FCM_SERVICE_ACCOUNT (Firebase console >
  # ┃   Project settings > Service accounts > Generate new private key, base64 -w0),
  # ┃   FCM_API_URL=https://fcm.googleapis.com, SMS_HTTP_URL / SMS_HTTP_TOKEN (SMS provider contract).
  # ┗━━━━━━━━━━━━━━━━
  notify-sim:
    <<: *restart
    build:
      context: ../services/notify-sim
    image: ehimaya/notify-sim:dev
    environment:
      SIM_DATA_DIR: /data
      SIM_PUBLIC_URL: http://notify-sim:8090
      SIM_FCM_PROJECT: ${SIM_FCM_PROJECT:-ehimaya-sim}
      SIM_SMS_TOKEN: ${SMS_HTTP_TOKEN:-sim-sms-token}
      SIM_SMS_FAIL_NUMBERS: ${SIM_SMS_FAIL_NUMBERS:-+21698000000}
    volumes:
      - notifysim:/data
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------- Live streaming (phase 6, docs/streaming.md) ----------------

  # One-shot: the recordings volume belongs to uid 10001 (MediaMTX writes, the API worker reads and deletes).
  recordings-init:
    image: bluenviron/mediamtx:1.21.2-ffmpeg@sha256:c0feb4acc548d5f410d57d9046f62dfa355e2abc4098f5243de9e86430c77a95
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown 10001:10001 /recordings && chmod 0770 /recordings"]
    volumes:
      - recordings:/recordings

  # Media server (MIT): WHIP from phones, RTSP/RTMP from drones and cameras, WHEP/HLS to the dashboard, fMP4
  # recording. Every publish/read is authorized by the API (infra/mediamtx/mediamtx.yml).
  mediamtx:
    <<: *restart
    image: bluenviron/mediamtx:1.21.2-ffmpeg@sha256:c0feb4acc548d5f410d57d9046f62dfa355e2abc4098f5243de9e86430c77a95
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    environment:
      MEDIAMTX_HOOK_TOKEN: ${MEDIAMTX_HOOK_TOKEN}
      # ICE candidates announced to phones and browsers (comma-separated IPs or names). Development: this machine;
      # a phone on the LAN needs the machine's LAN address here and the 8189/udp port published on it.
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_HOSTS:-127.0.0.1}
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./mediamtx/hook.sh:/hooks/hook.sh:ro
      - recordings:/recordings
    ports:
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:1935:1935"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:8189:8189/udp"
    # The last segment is finalised and its hook posted on shutdown.
    stop_grace_period: 20s
    healthcheck:
      # Any HTTP answer of the HLS listener (busybox wget exits non-zero on 404, hence the header check).
      test: ["CMD-SHELL", "wget -q -S -O /dev/null -T 3 http://127.0.0.1:8888/ 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      recordings-init:
        condition: service_completed_successfully

  # ┏━━ SIMULATION ━━ stream-sim (profile "sim"): a simulated camera registering a "[SIM]" stream with the API and
  # ┃   publishing a looped CC-BY-4.0 sample clip (Intel sample-videos, pinned by SHA-256) over RTSP. Dev/demo only.
  # ┃   docker compose --env-file .env -f infra/compose.yml --profile sim up -d
  # ┃ PRODUCTION: never enabled (APP_ENV=production refuses STREAM_SIM_TOKEN); real drones and cameras are registered
  # ┃   in the dashboard (POST /api/v1/staff/streams) and publish with their own token (docs/streaming.md).
  # ┗━━━━━━━━━━━━━━━━
  stream-sim:
    <<: *restart
    profiles: ["sim"]
    image: bluenviron/mediamtx:1.21.2-ffmpeg@sha256:c0feb4acc548d5f410d57d9046f62dfa355e2abc4098f5243de9e86430c77a95
    entrypoint: ["/bin/sh", "/sim/stream-sim.sh"]
    init: true
    environment:
      STREAM_SIM_TOKEN: ${STREAM_SIM_TOKEN:-}
      SIM_LABEL: ${SIM_LABEL:-SIM camera}
      SIM_GOUVERNORAT_CODE: ${SIM_GOUVERNORAT_CODE:-11}
      SIM_LAT: ${SIM_LAT:-36.8065}
      SIM_LON: ${SIM_LON:-10.1815}
      SIM_CLIP_URL: ${SIM_CLIP_URL:-https://raw.githubusercontent.com/intel-iot-devkit/sample-videos/master/people-detection.mp4}
      SIM_CLIP_SHA256: ${SIM_CLIP_SHA256:-18ffe8672d741e3e29c9d891d22c59d453720b086c25b35c88b393d55f92f693}
    volumes:
      - ./stream-sim/stream-sim.sh:/sim/stream-sim.sh:ro
      # SIMULATION: downloaded clip cache (verified by SHA-256 on every start).
      - simclips:/clips
    depends_on:
      api:
        condition: service_healthy
      mediamtx:
        condition: service_healthy

  # Fire/smoke/person detector (profile "vision", services/vision): watches live streams over internal RTSP as user
  # "vision" and analyses uploaded report images. Internal only (port 8100, never published or routed).
  # One-shot: installs the vision models (ONNX, pinned SHA-256) into visionmodels; skips what is already installed.
  vision-models:
    profiles: ["vision"]
    build:
      context: ../services/vision
      target: models
    image: ehimaya/vision-models:dev
    restart: "no"
    volumes:
      - visionmodels:/models

  vision:
    <<: *restart
    profiles: ["vision"]
    build:
      context: ../services/vision
      target: runtime
    image: ehimaya/vision:dev
    # Tokens are not compose-required (profile services are interpolated even when off); the service refuses to
    # start without them. Models: ONNX files installed in the visionmodels volume by services/vision/models/
    # fetch_models.py (Docker target "models"); without them /healthz says "degraded" and detection answers 503.
    environment:
      VISION_API_TOKEN: ${VISION_API_TOKEN:-}
      VISION_CALLBACK_TOKEN: ${VISION_CALLBACK_TOKEN:-}
      VISION_RTSP_PASSWORD: ${VISION_READ_PASSWORD:-}
      VISION_RTSP_URL_PREFIX: rtsp://mediamtx:8554/live/
      VISION_CALLBACK_URL_PREFIX: http://api:8000/internal/vision/
      VISION_MIN_CONFIDENCE: ${VISION_MIN_CONFIDENCE:-0.45}
      VISION_MAX_STREAMS: ${VISION_MAX_STREAMS:-8}
      # CPU budget: at most workers x threads cores for inference (+ one decoding thread per watched stream).
      VISION_INFERENCE_WORKERS: ${VISION_INFERENCE_WORKERS:-2}
      VISION_INFERENCE_THREADS: ${VISION_INFERENCE_THREADS:-2}
    volumes:
      - visionmodels:/models:ro
    read_only: true
    tmpfs:
      - /tmp  # multipart uploads over 1 MB are spooled here
    depends_on:
      vision-models:
        condition: service_completed_successfully
      mediamtx:
        condition: service_healthy

  # ---------------- AI layer 1 (profile "ai"): all models run on our own servers (NFR-10, NFR-11) ----------------

  # Local open language model server (Qwen3, Apache-2.0).
  ollama:
    <<: *restart
    profiles: ["ai"]
    image: ollama/ollama:0.40.1@sha256:69f27594d8127cb43db1edcafa5e2d3cd8f88bdbc54a2cf3ceb11b8d138a24b1
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot: download, convert and check the models (skipped when already installed).
  ai-models:
    profiles: ["ai"]
    build:
      context: ../services/ai
      target: models
    image: ehimaya/ai-models:dev
    restart: "no"
    command: ["--profile", "${AI_MODEL_PROFILE:-cpu}", "--out", "/models", "--ollama", "http://ollama:11434"]
    volumes:
      - aimodels:/models
    depends_on:
      ollama:
        condition: service_healthy

  # Inference service: speech-to-text, translation, embeddings, structured reading. Internal only.
  ai:
    <<: *restart
    profiles: ["ai"]
    build:
      context: ../services/ai
      target: runtime
    image: ehimaya/ai:dev
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN}
      AI_OLLAMA_URL: http://ollama:11434
      AI_LLM_MODEL: ${AI_LLM_MODEL:-qwen3:4b}
      AI_MEDIA_URL_PREFIX: http://seaweedfs:8333/
      AI_DEVICE: ${AI_DEVICE:-auto}
    volumes:
      - aimodels:/models:ro
    depends_on:
      ai-models:
        condition: service_completed_successfully

volumes:
  # SIMULATION: generated FCM service account of notify-sim. PRODUCTION: remove with the notify-sim service.
  notifysim:
  # SIMULATION: sample clip of stream-sim.
  simclips:
  # Recording segments between MediaMTX and the API worker (emptied as segments reach S3).
  recordings:
  visionmodels:
  aimodels:
  ollamadata:
  pgdata:
  valkeydata:
  natsdata:
  s3data:
