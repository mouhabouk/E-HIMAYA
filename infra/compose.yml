# ء-حماية / e-Himaya — البنية الأساسية للتطوير والتجربة (المراحل 1 إلى 5)
# Usage (from repo root):  docker compose --env-file .env -f infra/compose.yml up -d
# With the AI layer (downloads the models once, several GB):
#   docker compose --env-file .env -f infra/compose.yml --profile ai up -d
# On a GPU server add: -f infra/compose.gpu.yml
# Live streaming (phase 6, docs/streaming.md): MediaMTX always runs; add --profile sim for the simulated camera
# (stream-sim) and --profile vision for the fire/smoke detector (set VISION_SERVICE_URL=http://vision:8100).
name: ehimaya

x-restart: &restart
  restart: unless-stopped

# Images are pinned by digest (the tag is kept for readability); Dependabot proposes updates (.github/dependabot.yml).

services:
  postgres:
    <<: *restart
    build: ./postgres
    image: ehimaya/postgres:17-postgis-pgvector
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      EHIMAYA_DB_NAME: ${EHIMAYA_DB_NAME:-ehimaya}
      EHIMAYA_DB_USER: ${EHIMAYA_DB_USER:-ehimaya}
      EHIMAYA_DB_PASSWORD: ${EHIMAYA_DB_PASSWORD:?set EHIMAYA_DB_PASSWORD}
      # Runtime role of the API (DML only, append-only audit); the owner above runs the migrations.
      EHIMAYA_DB_RUNTIME_USER: ${EHIMAYA_DB_RUNTIME_USER:-ehimaya_app}
      EHIMAYA_DB_RUNTIME_PASSWORD: ${EHIMAYA_DB_RUNTIME_PASSWORD:-${EHIMAYA_DB_PASSWORD}}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${EHIMAYA_DB_NAME:-ehimaya}"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot, idempotent: (re)creates the API runtime role with the superuser, so volumes created before the role
  # existed are upgraded on the next `up` (infra/postgres/ehimaya-roles.sh).
  db-roles:
    image: ehimaya/postgres:17-postgis-pgvector
    restart: "no"
    entrypoint: ["/usr/local/bin/ehimaya-roles.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      EHIMAYA_DB_NAME: ${EHIMAYA_DB_NAME:-ehimaya}
      EHIMAYA_DB_USER: ${EHIMAYA_DB_USER:-ehimaya}
      EHIMAYA_DB_RUNTIME_USER: ${EHIMAYA_DB_RUNTIME_USER:-ehimaya_app}
      EHIMAYA_DB_RUNTIME_PASSWORD: ${EHIMAYA_DB_RUNTIME_PASSWORD:-${EHIMAYA_DB_PASSWORD}}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
    depends_on:
      postgres:
        condition: service_healthy

  valkey:
    <<: *restart
    image: valkey/valkey:9.1-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:?set VALKEY_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$${VALKEY_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

  nats:
    <<: *restart
    image: nats:2.15-alpine@sha256:2ae57dfba3063d5e25fecb75256118c0882a1a2d2cf7d0fba17a7c701df956f6
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_APP_USER: ${NATS_APP_USER:-ehimaya}
      NATS_APP_PASSWORD: ${NATS_APP_PASSWORD:?set NATS_APP_PASSWORD}
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - natsdata:/data
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for media and evidence (Apache-2.0)
  seaweedfs:
    <<: *restart
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sed -e "s|\$${S3_ACCESS_KEY}|$${S3_ACCESS_KEY}|" -e "s|\$${S3_SECRET_KEY}|$${S3_SECRET_KEY}|"
        /etc/seaweedfs/s3.json.template > /tmp/s3.json &&
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
        -master.volumeSizeLimitMB=1024 -volume.max=0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - ./seaweedfs/s3.json.template:/etc/seaweedfs/s3.json.template:ro
      - s3data:/data
    ports:
      - "127.0.0.1:8333:8333"

  # One-shot: create the media bucket (the API's S3 identity has no admin rights).
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for i in $$(seq 1 60); do
        echo "s3.bucket.create -name $${S3_BUCKET_MEDIA}" | weed shell -master=seaweedfs:9333 2>&1 | grep -q "created bucket" && exit 0;
        sleep 2;
        done; echo "bucket creation failed"; exit 1
    environment:
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-ehimaya-media}
    depends_on:
      - seaweedfs

  # Resumable uploads (tus 1.0) straight to S3; every upload is authorized by the API through hooks.
  tusd:
    <<: *restart
    image: tusproject/tusd:v2.10.1@sha256:7b1c552a8b42f4b36cb01f2a3bd49f82ab078b2eefd191459e716141dd50376c
    command:
      - -host=0.0.0.0
      - -port=1080
      - -base-path=/api/v1/uploads/
      - -s3-bucket=${S3_BUCKET_MEDIA:-ehimaya-media}
      - -s3-endpoint=http://seaweedfs:8333
      - -s3-object-prefix=uploads/
      - -disable-download
      - -max-size=314572800
      # The hook secret travels in the Authorization header (Go sends URL user info as HTTP Basic), not in the
      # path. Client headers are not forwarded: the API reads them from the hook event body.
      - -hooks-http=http://tusd:${TUSD_HOOK_SECRET:?set TUSD_HOOK_SECRET}@api:8000/internal/tusd/hooks
      - -hooks-enabled-events=pre-create,post-finish,post-terminate
      - -cors-allow-origin=${TUSD_CORS_ORIGIN_REGEX:-^http://localhost:517[34]$$}
      - -cors-allow-headers=Authorization,X-Device-Key
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: us-east-1
    ports:
      - "127.0.0.1:1080:1080"
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully

  keycloak:
    <<: *restart
    # Keycloak 26.8 (pinned by digest in the Dockerfile) with the provider ehimaya-phone-otp (phase A).
    build:
      context: ./keycloak
    image: ehimaya/keycloak:dev
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8080}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # Phase A sign-in by phone: the provider asks the API to send the SMS code (same secret as the API's).
      EHIMAYA_API_INTERNAL_URL: http://api:8000
      OTP_SMS_SECRET: ${OTP_SMS_SECRET:-}
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *restart
    build:
      context: ../services/api
    image: ehimaya/api:dev
    environment:
      # Runtime role: no DDL, no TRUNCATE, audit.log append-only. Migrations run in the `migrate` service below.
      DATABASE_URL: postgresql+asyncpg://${EHIMAYA_DB_RUNTIME_USER:-ehimaya_app}:${EHIMAYA_DB_RUNTIME_PASSWORD:-${EHIMAYA_DB_PASSWORD}}@postgres:5432/${EHIMAYA_DB_NAME:-ehimaya}
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      NATS_URL: nats://${NATS_APP_USER:-ehimaya}:${NATS_APP_PASSWORD}@nats:4222
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-ehimaya-media}
      # Pre-signed media links opened by the dashboard in the browser.
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
      # Issuer = public URL in tokens; JWKS fetched over the internal network.
      OIDC_ISSUERS: ${KEYCLOAK_HOSTNAME:-http://localhost:8080}/realms/ehimaya-public,${KEYCLOAK_HOSTNAME:-http://localhost:8080}/realms/ehimaya-staff
      OIDC_JWKS_BASE_URL: http://keycloak:8080
      OIDC_AUDIENCE: ehimaya-api
      ANON_PSEUDONYM_SECRET: ${ANON_PSEUDONYM_SECRET:?set ANON_PSEUDONYM_SECRET}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY}
      # Key rotation (A5): extra key versions "2:<base64>,…" and the version new values are written with.
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:-}
      FIELD_ENCRYPTION_ACTIVE_VERSION: ${FIELD_ENCRYPTION_ACTIVE_VERSION:-}
      TUSD_HOOK_SECRET: ${TUSD_HOOK_SECRET}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      # development | production (infra/compose.prod.yml): production hides /docs and refuses example secrets.
      APP_ENV: ${APP_ENV:-development}
      # Environment strip (backlog G3): auto | development | pilot | training | off.
      ENVIRONMENT_BANNER: ${ENVIRONMENT_BANNER:-auto}
      # all = HTTP + background loops in one container (development); production splits api / worker.
      PROCESS_ROLE: ${PROCESS_ROLE:-all}
      # Proxies whose X-Forwarded-For is trusted (uvicorn). Development: none in front of the API.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Anonymous abuse controls (A1); defaults in services/api/app/core/config.py.
      ANON_IDENTITY_PER_IP: ${ANON_IDENTITY_PER_IP:-60}
      ANON_IDENTITY_WINDOW_S: ${ANON_IDENTITY_WINDOW_S:-3600}
      ANON_REPORT_PER_IP: ${ANON_REPORT_PER_IP:-60}
      ANON_REPORT_WINDOW_S: ${ANON_REPORT_WINDOW_S:-600}
      ANON_CONSENT_PER_IP: ${ANON_CONSENT_PER_IP:-60}
      ANON_DEVICE_PER_IP: ${ANON_DEVICE_PER_IP:-120}
      ANON_REPORT_BUDGET: ${ANON_REPORT_BUDGET:-300}
      ANON_REPORT_BUDGET_WINDOW_S: ${ANON_REPORT_BUDGET_WINDOW_S:-600}
      # Retention and anonymisation (A6), run by the background loops; durations in days.
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      RETENTION_INTERVAL_S: ${RETENTION_INTERVAL_S:-3600}
      RETENTION_EVENTS_DAYS: ${RETENTION_EVENTS_DAYS:-7}
      RETENTION_NOTIFY_OUTBOX_DAYS: ${RETENTION_NOTIFY_OUTBOX_DAYS:-30}
      RETENTION_NOTIFY_DISPATCH_DAYS: ${RETENTION_NOTIFY_DISPATCH_DAYS:-180}
      RETENTION_DEVICE_DAYS: ${RETENTION_DEVICE_DAYS:-180}
      RETENTION_DEVICE_LOCATION_DAYS: ${RETENTION_DEVICE_LOCATION_DAYS:-30}
      RETENTION_CREW_POSITION_DAYS: ${RETENTION_CREW_POSITION_DAYS:-30}
      RETENTION_REPORT_DAYS: ${RETENTION_REPORT_DAYS:-1826}
      RETENTION_CONSENT_DAYS: ${RETENTION_CONSENT_DAYS:-1826}
      RETENTION_ANON_ACCOUNT_DAYS: ${RETENTION_ANON_ACCOUNT_DAYS:-365}
      RETENTION_ERASURE_DAYS: ${RETENTION_ERASURE_DAYS:-30}
      # Institutions portal (phase 4): invitation and certificate verification links, certificate signing.
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-http://localhost:5174}
      CERTIFICATE_SIGNING_KEY: ${CERTIFICATE_SIGNING_KEY:-}
      # Phase 10: certificate key rotation, evidence anchoring and the staff second factor.
      CERTIFICATE_PREVIOUS_PUBLIC_KEYS: ${CERTIFICATE_PREVIOUS_PUBLIC_KEYS:-}
      EVIDENCE_SIGNING_KEY: ${EVIDENCE_SIGNING_KEY:-}
      TSA_URL: ${TSA_URL:-}
      STAFF_MFA_REQUIRED: ${STAFF_MFA_REQUIRED:-true}
      # Rewards (phase 8): QR base of reward certificates, daily cap and badge thresholds.
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      REWARDS_DAILY_CAP: ${REWARDS_DAILY_CAP:-200}
      REWARDS_BADGE_BRONZE: ${REWARDS_BADGE_BRONZE:-100}
      REWARDS_BADGE_SILVER: ${REWARDS_BADGE_SILVER:-500}
      REWARDS_BADGE_GOLD: ${REWARDS_BADGE_GOLD:-2000}
      REWARDS_BADGE_AMBASSADOR: ${REWARDS_BADGE_AMBASSADOR:-10000}
      # AI layer (profile "ai"). Unset: reports are still scored and grouped by the rules.
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      # Notification channels (phase 5). An empty channel is recorded as skipped; the others still go out.
      # E-mail goes to Mailpit by default (development): every message is visible at http://localhost:8025.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-e-Himaya <no-reply@ehimaya.tn>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      # ┏━━ SIMULATION ━━ push and SMS go to notify-sim (emulated FCM HTTP v1 + OAuth, Tunisian SMS gateway)
      # ┃ PRODUCTION: in .env set FCM_SERVICE_ACCOUNT=<base64 -w0 of the key from Firebase console > Project settings >
      # ┃   Service accounts > Generate new private key> (it wins over FCM_SERVICE_ACCOUNT_FILE),
      # ┃   FCM_API_URL=https://fcm.googleapis.com, SMS_HTTP_URL and SMS_HTTP_TOKEN from the SMS provider contract;
      # ┃   then delete the notify-sim service, the volume line and depends_on entry below and the notifysim volume.
      # ┗━━━━━━━━━━━━━━━━
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-/run/notify-sim/fcm-service-account.json}
      FCM_API_URL: ${FCM_API_URL:-http://notify-sim:8090}
      SMS_HTTP_URL: ${SMS_HTTP_URL:-http://notify-sim:8090/sms/send}
      SMS_HTTP_TOKEN: ${SMS_HTTP_TOKEN:-sim-sms-token}
      SMS_SENDER: ${SMS_SENDER:-E-HIMAYA}
      # Live streaming (phase 6, docs/streaming.md). MediaMTX asks the API who may publish/read (/internal/mediamtx/auth)
      # and posts path events with MEDIAMTX_HOOK_TOKEN; the API kicks publishers through the MediaMTX API.
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_API_PASSWORD: ${MEDIAMTX_API_PASSWORD:?set MEDIAMTX_API_PASSWORD}
      MEDIAMTX_HOOK_TOKEN: ${MEDIAMTX_HOOK_TOKEN:?set MEDIAMTX_HOOK_TOKEN}
      # Addresses handed to clients: WHIP/WHEP and HLS base URLs, host of the RTSP/RTMP URLs given to drones/cameras.
      STREAM_WEBRTC_PUBLIC_URL: ${STREAM_WEBRTC_PUBLIC_URL:-http://localhost:8889}
      STREAM_HLS_PUBLIC_URL: ${STREAM_HLS_PUBLIC_URL:-http://localhost:8888}
      STREAM_INGEST_HOST: ${STREAM_INGEST_HOST:-localhost}
      STREAM_RECORDINGS_DIR: /recordings
      STREAM_MAX_DURATION_S: ${STREAM_MAX_DURATION_S:-900}
      STREAM_CREATE_PER_HOUR: ${STREAM_CREATE_PER_HOUR:-6}
      RETENTION_STREAM_DAYS: ${RETENTION_STREAM_DAYS:-365}
      # SIMULATION: token of stream-sim (profile "sim") for /internal/sim/streams. PRODUCTION: empty (refused).
      STREAM_SIM_TOKEN: ${STREAM_SIM_TOKEN:-}
      # Fire/smoke detector (profile "vision"). Empty VISION_SERVICE_URL: streams and uploads work without detection.
      VISION_SERVICE_URL: ${VISION_SERVICE_URL:-}
      VISION_API_TOKEN: ${VISION_API_TOKEN:-}
      VISION_CALLBACK_TOKEN: ${VISION_CALLBACK_TOKEN:-}
      # Sensors of the local network (L5b): the gateway beside MediaMTX relays their signed readings.
      SENSOR_GATEWAY_TOKEN: ${SENSOR_GATEWAY_TOKEN:-}
      VISION_READ_PASSWORD: ${VISION_READ_PASSWORD:-}
      VISION_MIN_CONFIDENCE: ${VISION_MIN_CONFIDENCE:-0.45}
      VISION_ALERT_CONFIDENCE: ${VISION_ALERT_CONFIDENCE:-0.6}
      # Decision support (phase 7, docs/decision-support.md). Routing engine (profile "routing"): set
      # ROUTING_URL=http://routing:8002; empty = straight-line estimates ("engine": "fallback").
      ROUTING_URL: ${ROUTING_URL:-}
      # The Office's map server (phase M, docs/offline-maps.md): imagery and labels of the satellite basemap; empty =
      # the public sources (Sentinel-2 cloudless by EOX, Esri labels).
      BASEMAP_OPEN_TILES: ${BASEMAP_OPEN_TILES:-}
      BASEMAP_OPEN_ATTRIBUTION: ${BASEMAP_OPEN_ATTRIBUTION:-}
      BASEMAP_OPEN_MAX_ZOOM: ${BASEMAP_OPEN_MAX_ZOOM:-}
      BASEMAP_LABEL_TILES: ${BASEMAP_LABEL_TILES:-}
      BASEMAP_LABEL_ATTRIBUTION: ${BASEMAP_LABEL_ATTRIBUTION:-}
      BASEMAP_LABEL_MAX_ZOOM: ${BASEMAP_LABEL_MAX_ZOOM:-}
      # Incident assistant: the Ollama server of the AI layer (profile "ai"); empty = 503 assistant_unavailable.
      OLLAMA_URL: ${OLLAMA_URL:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-${AI_LLM_MODEL:-qwen3:4b}}
      PROCEDURES_DIR: /app/procedures
      # Telephony (phase 7, docs/telephony.md). Asterisk's ARI (internal only); the WebSocket SIP address handed to the
      # dashboard softphone; MixMonitor recordings shared with the worker loops (hashed, stored in S3, deleted).
      TELEPHONY_ARI_URL: http://telephony:8088
      TELEPHONY_ARI_PASSWORD: ${TELEPHONY_ARI_PASSWORD:?set TELEPHONY_ARI_PASSWORD}
      TELEPHONY_WS_PUBLIC_URL: ${TELEPHONY_WS_PUBLIC_URL:-ws://localhost:8088/ws}
      TELEPHONY_SIP_DOMAIN: ${TELEPHONY_SIP_DOMAIN:-ehimaya.local}
      TELEPHONY_ICE_SERVERS: ${TELEPHONY_ICE_SERVERS:-}
      TELEPHONY_RECORDINGS_DIR: /telephony-recordings
      TELEPHONY_CREDENTIAL_TTL_S: ${TELEPHONY_CREDENTIAL_TTL_S:-14400}
      TELEPHONY_TRUNK_ENABLED: ${TELEPHONY_TRUNK_ENABLED:-false}
      # Scenario 2 (ADR-10): transfer to 198 through the trunk, only once agreed with the Civil Protection.
      TELEPHONY_TRANSFER_198_ENABLED: ${TELEPHONY_TRANSFER_198_ENABLED:-false}
      TELEPHONY_DIAL_PER_HOUR: ${TELEPHONY_DIAL_PER_HOUR:-60}
      # Calls are recorded after the recorded-call notice (legal point L04). Production: false until the processing is
      # declared to the INPDP; keep the same value as the telephony service.
      TELEPHONY_RECORDING_ENABLED: ${TELEPHONY_RECORDING_ENABLED:-true}
      # Call metadata and recordings: at most 2 years (L04).
      RETENTION_CALL_DAYS: ${RETENTION_CALL_DAYS:-730}
      # SIMULATION: token of the smoke test for /internal/sim/calls. PRODUCTION: empty (refused).
      TELEPHONY_SIM_TOKEN: ${TELEPHONY_SIM_TOKEN:-}
      # SMS reports (FR-A-048): HMAC secret of the SMS gateway's webhook POST /internal/sms/inbound; empty = 404.
      SMS_INBOUND_SECRET: ${SMS_INBOUND_SECRET:-}
      SMS_DEDUP_WINDOW_H: ${SMS_DEDUP_WINDOW_H:-48}
      # ┏━━ DEMONSTRATION ━━ an Android phone with a SIM card as the SMS gateway (docs/sms-phone-gateway.md): the
      # ┃   signing key of its webhook, and its local server for the replies. PRODUCTION: empty.
      # ┗━━━━━━━━━━━━━━━━
      SMS_PHONE_SIGNING_KEY: ${SMS_PHONE_SIGNING_KEY:-}
      SMS_PHONE_URL: ${SMS_PHONE_URL:-}
      SMS_PHONE_USERNAME: ${SMS_PHONE_USERNAME:-}
      SMS_PHONE_PASSWORD: ${SMS_PHONE_PASSWORD:-}
      # Phase A: Keycloak (provider ehimaya-phone-otp) asks for the SMS sign-in code here; empty = 404.
      OTP_SMS_SECRET: ${OTP_SMS_SECRET:-}
      # Weather layer and spread forecasts (phase 7, docs/weather-forecast.md).
      # ┏━━ SIMULATION ━━ weather: empty WEATHER_PROVIDER = "sim" in development (deterministic simulated grid, every
      # ┃   value flagged "simulated": true), "open-meteo" in production (which refuses "sim").
      # ┃ PRODUCTION: WEATHER_PROVIDER=open-meteo; the free api.open-meteo.com is non-commercial only: for an
      # ┃   operational service set WEATHER_API_URL=https://customer-api.open-meteo.com and WEATHER_API_KEY, or the
      # ┃   URL of a self-hosted Open-Meteo server (no key). See docs/weather-forecast.md for INM.
      # ┗━━━━━━━━━━━━━━━━
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-}
      WEATHER_API_URL: ${WEATHER_API_URL:-https://api.open-meteo.com}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      WEATHER_REFRESH_INTERVAL_S: ${WEATHER_REFRESH_INTERVAL_S:-1800}
      # Terrain model (Copernicus GLO-90) installed by the one-shot `terrain` service; absent = slope 0, stated.
      TERRAIN_DIR: /terrain
      # Analytics and reports (phase 8): k-anonymity floor of exports, scenario runs, worker loop interval.
      ANALYTICS_MIN_CELL: ${ANALYTICS_MIN_CELL:-5}
      ANALYTICS_SCENARIO_RUNS: ${ANALYTICS_SCENARIO_RUNS:-200}
      ANALYTICS_INTERVAL_S: ${ANALYTICS_INTERVAL_S:-60}
      # Events library (phase 8, docs/api/phase-8-contract.md §2). OpenSearch (profile "search"): set
      # OPENSEARCH_URL=https://opensearch:9200 and OPENSEARCH_PASSWORD; empty URL = PostgreSQL full-text fallback.
      SEARCH_BACKEND: ${SEARCH_BACKEND:-opensearch}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-}
      OPENSEARCH_USER: ${OPENSEARCH_USER:-ehimaya}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      OPENSEARCH_CA_FILE: /opensearch-ca/ca.pem
      OPENSEARCH_INDEX_PREFIX: ${OPENSEARCH_INDEX_PREFIX:-ehimaya}
      LIBRARY_SEARCH_PER_MINUTE: ${LIBRARY_SEARCH_PER_MINUTE:-60}
    volumes:
      # SIMULATION: the service account generated by notify-sim (read-only). PRODUCTION: remove this line.
      - notifysim:/run/notify-sim:ro
      # Finished recording segments written by MediaMTX: hashed, stored in S3, then deleted by the worker loops.
      - recordings:/recordings
      # Call recordings written by Asterisk (MixMonitor), ingested by the worker loop "telephony-recordings".
      - telrecordings:/telephony-recordings
      # Procedures library of the incident assistant, indexed by the worker loop "procedures-index".
      - ../docs/procedures:/app/procedures:ro
      # Terrain model of the spread forecasts (filled by `docker compose --profile terrain run --rm terrain`).
      - terrain:/terrain:ro
      # CA certificate of the OpenSearch node (written by it on first start), to verify its TLS certificate.
      - opensearch-ca:/opensearch-ca:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
      # SIMULATION: remove in production together with the notify-sim service.
      notify-sim:
        condition: service_healthy

  # One-shot: database migrations as the owner role, then the runtime role's grants (services/api/migrations/env.py).
  # Same image and settings as the api; `docker compose run --rm migrate` re-runs it by hand.
  migrate:
    extends: api
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${EHIMAYA_DB_USER:-ehimaya}:${EHIMAYA_DB_PASSWORD}@postgres:5432/${EHIMAYA_DB_NAME:-ehimaya}
      DB_RUNTIME_ROLE: ${EHIMAYA_DB_RUNTIME_USER:-ehimaya_app}
    ports: !reset []
    volumes: !reset []
    healthcheck:
      disable: true
    depends_on: !override
      db-roles:
        condition: service_completed_successfully

  # One-shot: installs the terrain model of Tunisia (Copernicus DEM GLO-90, 40 tiles pinned by SHA-256, ~150 MB
  # downloaded from the AWS Open Data bucket, ~115 MB installed) into the terrain volume; skips an installed model.
  # Opt-in: `docker compose --profile terrain run --rm terrain`. Never committed to the repository.
  terrain:
    profiles: ["terrain"]
    build:
      context: ../services/api
    image: ehimaya/api:dev
    restart: "no"
    command: ["python", "-m", "app.modules.forecast.terrain_fetch", "--out", "/terrain"]
    volumes:
      - terrain:/terrain
    healthcheck:
      disable: true

  # Development mail catcher (MIT): receives every e-mail the API sends; web UI on http://localhost:8025.
  # In production point SMTP_HOST at the real relay instead.
  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    environment:
      MP_MAX_MESSAGES: 5000
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  # ┏━━ SIMULATION ━━ notify-sim: emulates Firebase Cloud Messaging HTTP v1 (OAuth service-account flow) and the HTTP
  # ┃   SMS gateway of a Tunisian operator. Inbox of every push and SMS: http://localhost:8090. Dev/test only.
  # ┃ PRODUCTION: delete this service and the notifysim volume; in .env set FCM_SERVICE_ACCOUNT (Firebase console >
  # ┃   Project settings > Service accounts > Generate new private key, base64 -w0),
  # ┃   FCM_API_URL=https://fcm.googleapis.com, SMS_HTTP_URL / SMS_HTTP_TOKEN (SMS provider contract).
  # ┗━━━━━━━━━━━━━━━━
  notify-sim:
    <<: *restart
    build:
      context: ../services/notify-sim
    image: ehimaya/notify-sim:dev
    environment:
      SIM_DATA_DIR: /data
      SIM_PUBLIC_URL: http://notify-sim:8090
      SIM_FCM_PROJECT: ${SIM_FCM_PROJECT:-ehimaya-sim}
      SIM_SMS_TOKEN: ${SMS_HTTP_TOKEN:-sim-sms-token}
      SIM_SMS_FAIL_NUMBERS: ${SIM_SMS_FAIL_NUMBERS:-+21698000000}
    volumes:
      - notifysim:/data
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------- Live streaming (phase 6, docs/streaming.md) ----------------

  # Gateway of the sensors (L5b, docs/sensor-gateway.md): on the MediaMTX server, receives the signed readings of the
  # sensors of the local network and relays them to the API. Started with the "sensors" profile; the [SIM] scenarios
  # are played with `docker compose exec sensor-gateway python -m gateway simulate` (SIM_SENSORS set).
  sensor-gateway:
    <<: *restart
    profiles: [sensors]
    build:
      context: ../services/sensor-gateway
    image: ehimaya/sensor-gateway:dev
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    environment:
      GATEWAY_API_URL: http://api:8000
      GATEWAY_TOKEN: ${SENSOR_GATEWAY_TOKEN:?set SENSOR_GATEWAY_TOKEN}
      SIM_SENSORS: ${SIM_SENSORS:-}
    volumes:
      - sensorqueue:/data
    ports:
      # Development: this machine only. On the MediaMTX server, the address of its local-network interface.
      - "127.0.0.1:8088:8088"
    depends_on:
      api:
        condition: service_healthy

  # One-shot: the recordings volume belongs to uid 10001 (MediaMTX writes, the API worker reads and deletes).
  recordings-init:
    image: bluenviron/mediamtx:1.21.3-ffmpeg@sha256:208e9f1740a09a5ee63b6308e77ce0d54fce0456462f640e6bd9acfc62ebb5a2
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown 10001:10001 /recordings && chmod 0770 /recordings"]
    volumes:
      - recordings:/recordings

  # Media server (MIT): WHIP from phones, RTSP/RTMP from drones and cameras, WHEP/HLS to the dashboard, fMP4
  # recording. Every publish/read is authorized by the API (infra/mediamtx/mediamtx.yml).
  mediamtx:
    <<: *restart
    image: bluenviron/mediamtx:1.21.3-ffmpeg@sha256:208e9f1740a09a5ee63b6308e77ce0d54fce0456462f640e6bd9acfc62ebb5a2
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    environment:
      MEDIAMTX_HOOK_TOKEN: ${MEDIAMTX_HOOK_TOKEN}
      # ICE candidates announced to phones and browsers (comma-separated IPs or names). Development: this machine;
      # a phone on the LAN needs the machine's LAN address here and the 8189/udp port published on it.
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_HOSTS:-127.0.0.1}
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./mediamtx/hook.sh:/hooks/hook.sh:ro
      - recordings:/recordings
    ports:
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:1935:1935"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:8189:8189/udp"
    # The last segment is finalised and its hook posted on shutdown.
    stop_grace_period: 20s
    healthcheck:
      # Any HTTP answer of the HLS listener (busybox wget exits non-zero on 404, hence the header check).
      test: ["CMD-SHELL", "wget -q -S -O /dev/null -T 3 http://127.0.0.1:8888/ 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      recordings-init:
        condition: service_completed_successfully

  # ┏━━ SIMULATION ━━ stream-sim (profile "sim"): a simulated camera registering a "[SIM]" stream with the API and
  # ┃   publishing a looped CC-BY-4.0 sample clip (Intel sample-videos, pinned by SHA-256) over RTSP. Dev/demo only.
  # ┃   docker compose --env-file .env -f infra/compose.yml --profile sim up -d
  # ┃ PRODUCTION: never enabled (APP_ENV=production refuses STREAM_SIM_TOKEN); real drones and cameras are registered
  # ┃   in the dashboard (POST /api/v1/staff/streams) and publish with their own token (docs/streaming.md).
  # ┗━━━━━━━━━━━━━━━━
  stream-sim:
    <<: *restart
    profiles: ["sim"]
    image: bluenviron/mediamtx:1.21.3-ffmpeg@sha256:208e9f1740a09a5ee63b6308e77ce0d54fce0456462f640e6bd9acfc62ebb5a2
    entrypoint: ["/bin/sh", "/sim/stream-sim.sh"]
    init: true
    environment:
      STREAM_SIM_TOKEN: ${STREAM_SIM_TOKEN:-}
      SIM_LABEL: ${SIM_LABEL:-SIM camera}
      SIM_GOUVERNORAT_CODE: ${SIM_GOUVERNORAT_CODE:-11}
      SIM_LAT: ${SIM_LAT:-36.8065}
      SIM_LON: ${SIM_LON:-10.1815}
      SIM_CLIP_URL: ${SIM_CLIP_URL:-https://raw.githubusercontent.com/intel-iot-devkit/sample-videos/master/people-detection.mp4}
      SIM_CLIP_SHA256: ${SIM_CLIP_SHA256:-18ffe8672d741e3e29c9d891d22c59d453720b086c25b35c88b393d55f92f693}
    volumes:
      - ./stream-sim/stream-sim.sh:/sim/stream-sim.sh:ro
      # SIMULATION: downloaded clip cache (verified by SHA-256 on every start).
      - simclips:/clips
    depends_on:
      api:
        condition: service_healthy
      mediamtx:
        condition: service_healthy

  # Review point 25 (phase D): relays an institution's RTSP-only camera (Tapo C200 and the like) on the local network
  # to the path the API gave it. Not a simulation: the real camera's picture. docs/demo.md §4.
  camera-relay:
    <<: *restart
    profiles: ["camera"]
    image: bluenviron/mediamtx:1.21.2-ffmpeg@sha256:c0feb4acc548d5f410d57d9046f62dfa355e2abc4098f5243de9e86430c77a95
    entrypoint: ["/bin/sh", "/relay/camera-relay.sh"]
    init: true
    environment:
      CAMERA_RTSP_URL: ${CAMERA_RTSP_URL:-}
      CAMERA_PUBLISH_URL: ${CAMERA_PUBLISH_URL:-}
    volumes:
      - ./camera-relay/camera-relay.sh:/relay/camera-relay.sh:ro
    depends_on:
      mediamtx:
        condition: service_healthy

  # ---------------- Telephony (phase 7, docs/telephony.md) ----------------

  # One-shot: the call recordings volume belongs to uid 10001 (Asterisk writes, the API worker reads and deletes).
  telrecordings-init:
    image: ehimaya/telephony:dev
    build:
      context: ../services/telephony
      target: runtime
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown 10001:10001 /var/spool/asterisk/ehimaya && chmod 0770 /var/spool/asterisk/ehimaya"]
    volumes:
      - telrecordings:/var/spool/asterisk/ehimaya

  # Asterisk 22 LTS (GPL-2.0, separate process, configured only through files and ARI): public entry 8000 → queue of
  # operators, WebRTC softphones over WSS, recordings, crisis rooms. The emergency path never waits for the API.
  # Development: SIP and ARI on this machine only; the browser softphone connects to ws://localhost:8088/ws.
  telephony:
    <<: *restart
    build:
      context: ../services/telephony
      target: runtime
    image: ehimaya/telephony:dev
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TELEPHONY_ARI_PASSWORD: ${TELEPHONY_ARI_PASSWORD:?set TELEPHONY_ARI_PASSWORD}
      # Address announced in SDP/ICE to trunks and browsers (public IP or name in production).
      TELEPHONY_EXTERNAL_HOST: ${TELEPHONY_EXTERNAL_HOST:-127.0.0.1}
      TELEPHONY_RTP_START: ${TELEPHONY_RTP_START:-10000}
      TELEPHONY_RTP_END: ${TELEPHONY_RTP_END:-10099}
      TELEPHONY_QUEUE_TIMEOUT_S: ${TELEPHONY_QUEUE_TIMEOUT_S:-300}
      TELEPHONY_TRANSFER_198_ENABLED: ${TELEPHONY_TRANSFER_198_ENABLED:-false}
      TELEPHONY_RECORDING_ENABLED: ${TELEPHONY_RECORDING_ENABLED:-true}
      # SIP trunk of the operator (Tunisie Telecom, Ooredoo or Orange); empty = no trunk (docs/telephony.md).
      TELEPHONY_TRUNK_HOST: ${TELEPHONY_TRUNK_HOST:-}
      TELEPHONY_TRUNK_PORT: ${TELEPHONY_TRUNK_PORT:-5060}
      TELEPHONY_TRUNK_TRANSPORT: ${TELEPHONY_TRUNK_TRANSPORT:-udp}
      TELEPHONY_TRUNK_USERNAME: ${TELEPHONY_TRUNK_USERNAME:-}
      TELEPHONY_TRUNK_PASSWORD: ${TELEPHONY_TRUNK_PASSWORD:-}
      TELEPHONY_TRUNK_DOMAIN: ${TELEPHONY_TRUNK_DOMAIN:-}
      TELEPHONY_TRUNK_MATCH: ${TELEPHONY_TRUNK_MATCH:-}
      TELEPHONY_TRUNK_REGISTER: ${TELEPHONY_TRUNK_REGISTER:-false}
      TELEPHONY_TRUNK_CODECS: ${TELEPHONY_TRUNK_CODECS:-alaw,ulaw}
      TELEPHONY_TRUNK_MEDIA_ENCRYPTION: ${TELEPHONY_TRUNK_MEDIA_ENCRYPTION:-no}
      TELEPHONY_TRUNK_NUMBER_FORMAT: ${TELEPHONY_TRUNK_NUMBER_FORMAT:-e164}
      TELEPHONY_TRUNK_CALLER_ID: ${TELEPHONY_TRUNK_CALLER_ID:-}
      TELEPHONY_TRUNK_198_NUMBER: ${TELEPHONY_TRUNK_198_NUMBER:-198}
      # SIMULATION: password of the call-sim endpoint (profile "sim"). PRODUCTION: empty (no simulator endpoint).
      TELEPHONY_SIM_PASSWORD: ${TELEPHONY_SIM_PASSWORD:-}
    volumes:
      - telrecordings:/var/spool/asterisk/ehimaya
      # TLS certificate and key for SIP over TLS (5061) to a trunk, when used (docs/telephony.md).
      # - ./telephony/certs:/etc/ehimaya-asterisk/certs:ro
    ports:
      - "127.0.0.1:5060:5060/udp"
      - "127.0.0.1:5060:5060/tcp"
      - "127.0.0.1:8088:8088"
      - "127.0.0.1:${TELEPHONY_RTP_START:-10000}-${TELEPHONY_RTP_END:-10099}:${TELEPHONY_RTP_START:-10000}-${TELEPHONY_RTP_END:-10099}/udp"
    stop_grace_period: 20s
    depends_on:
      telrecordings-init:
        condition: service_completed_successfully

  # ┏━━ SIMULATION ━━ call-sim (profile "sim"): a second Asterisk placing a scripted call to 8000 every
  # ┃   CALL_SIM_INTERVAL_S seconds (source=sim, "[SIM]" caller) and playing a generated Arabic/French prompt, so the
  # ┃   queue, the dashboard softphone, recording and linking run end to end. It also answers outbound calls and
  # ┃   crisis-room invitations while no trunk is configured. Dev/demo only.
  # ┃ PRODUCTION: never enabled; real calls arrive through the SIP trunk (docs/telephony.md).
  # ┗━━━━━━━━━━━━━━━━
  call-sim:
    <<: *restart
    profiles: ["sim"]
    build:
      context: ../services/telephony
      target: call-sim
    image: ehimaya/call-sim:dev
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TELEPHONY_SIM_PASSWORD: ${TELEPHONY_SIM_PASSWORD:-}
      CALL_SIM_TARGET: telephony
      CALL_SIM_INTERVAL_S: ${CALL_SIM_INTERVAL_S:-300}
      CALL_SIM_FIRST_DELAY_S: ${CALL_SIM_FIRST_DELAY_S:-20}
      CALL_SIM_TALK_S: ${CALL_SIM_TALK_S:-30}
    depends_on:
      telephony:
        condition: service_healthy

  # Fire/smoke/person detector (profile "vision", services/vision): watches live streams over internal RTSP as user
  # "vision" and analyses uploaded report images. Internal only (port 8100, never published or routed).
  # One-shot: installs the vision models (ONNX, pinned SHA-256) into visionmodels; skips what is already installed.
  vision-models:
    profiles: ["vision"]
    build:
      context: ../services/vision
      target: models
    image: ehimaya/vision-models:dev
    restart: "no"
    volumes:
      - visionmodels:/models

  vision:
    <<: *restart
    profiles: ["vision"]
    build:
      context: ../services/vision
      target: runtime
    image: ehimaya/vision:dev
    # Tokens are not compose-required (profile services are interpolated even when off); the service refuses to
    # start without them. Models: ONNX files installed in the visionmodels volume by services/vision/models/
    # fetch_models.py (Docker target "models"); without them /healthz says "degraded" and detection answers 503.
    environment:
      VISION_API_TOKEN: ${VISION_API_TOKEN:-}
      VISION_CALLBACK_TOKEN: ${VISION_CALLBACK_TOKEN:-}
      VISION_RTSP_PASSWORD: ${VISION_READ_PASSWORD:-}
      VISION_RTSP_URL_PREFIX: rtsp://mediamtx:8554/live/
      VISION_CALLBACK_URL_PREFIX: http://api:8000/internal/vision/
      VISION_MIN_CONFIDENCE: ${VISION_MIN_CONFIDENCE:-0.45}
      VISION_MAX_STREAMS: ${VISION_MAX_STREAMS:-8}
      # CPU budget: at most workers x threads cores for inference (+ one decoding thread per watched stream).
      VISION_INFERENCE_WORKERS: ${VISION_INFERENCE_WORKERS:-2}
      VISION_INFERENCE_THREADS: ${VISION_INFERENCE_THREADS:-2}
    volumes:
      - visionmodels:/models:ro
    read_only: true
    tmpfs:
      - /tmp  # multipart uploads over 1 MB are spooled here
    depends_on:
      vision-models:
        condition: service_completed_successfully
      mediamtx:
        condition: service_healthy

  # Drone position reader (L5b, profile "drones"): reads the KLV (MISB ST 0601) of the drone streams on air from
  # MediaMTX over SRT and relays the positions to the API (/internal/drones/telemetry). Read only: nothing is ever sent
  # to a drone. Same image as the vision service; no model needed.
  drone-telemetry:
    <<: *restart
    profiles: ["drones"]
    image: ehimaya/vision:dev
    command: ["python", "-m", "app.telemetry", "serve"]
    environment:
      TELEMETRY_API_URL: http://api:8000
      TELEMETRY_GATEWAY_TOKEN: ${SENSOR_GATEWAY_TOKEN:-}
      TELEMETRY_READ_PASSWORD: ${VISION_READ_PASSWORD:-}
    read_only: true
    depends_on:
      mediamtx:
        condition: service_healthy

  # ---------------- Events library search (phase 8, profile "search") ----------------

  # One-shot: the certificate volume belongs to the OpenSearch user (uid 1000) only; the CA volume is world-readable
  # (the API reads ca.pem from it).
  opensearch-init:
    profiles: ["search"]
    image: opensearchproject/opensearch:2.19.6@sha256:be67c71b8d0e5edf1e9825145501c0136c3b8221206e1ce782ce17b04d0280b5
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown 1000:1000 /certs /ca && chmod 0700 /certs && chmod 0755 /ca"]
    volumes:
      - opensearch-certs:/certs
      - opensearch-ca:/ca

  # OpenSearch 2 (Apache-2.0), single node, security plugin on: TLS with this installation's own CA, HTTP basic auth,
  # no demo users or certificates (infra/opensearch/ehimaya-entrypoint.sh). Two users: "admin" (operations) and the
  # API's user, limited to the OPENSEARCH_INDEX_PREFIX-* indices. No published port. Passwords are not
  # compose-required (profile services are interpolated even when off); the entrypoint refuses to start without them.
  opensearch:
    <<: *restart
    profiles: ["search"]
    image: opensearchproject/opensearch:2.19.6@sha256:be67c71b8d0e5edf1e9825145501c0136c3b8221206e1ce782ce17b04d0280b5
    entrypoint: ["/bin/bash", "/usr/local/bin/ehimaya-entrypoint.sh"]
    environment:
      OPENSEARCH_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:-}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      OPENSEARCH_USER: ${OPENSEARCH_USER:-ehimaya}
      OPENSEARCH_INDEX_PREFIX: ${OPENSEARCH_INDEX_PREFIX:-ehimaya}
      OPENSEARCH_CA_DIR: /opensearch-ca
      # Heap: half of the container's memory at most (the rest is the file-system cache of Lucene).
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP:-512m} -Xmx${OPENSEARCH_HEAP:-512m}
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
    volumes:
      - ./opensearch/ehimaya-entrypoint.sh:/usr/local/bin/ehimaya-entrypoint.sh:ro
      - opensearch-data:/usr/share/opensearch/data
      - opensearch-certs:/usr/share/opensearch/config/certs
      - opensearch-ca:/opensearch-ca
    mem_limit: ${OPENSEARCH_MEM_LIMIT:-1g}
    cpus: ${OPENSEARCH_CPUS:-2}
    healthcheck:
      # Answers only once the security configuration accepts the API's user (green or yellow: single node).
      test: ["CMD-SHELL", "curl -sf --cacert /opensearch-ca/ca.pem -u \"$$OPENSEARCH_USER:$$OPENSEARCH_PASSWORD\" 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=4s' >/dev/null"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 60s
    depends_on:
      opensearch-init:
        condition: service_completed_successfully

  # ---------------- AI layer 1 (profile "ai"): all models run on our own servers (NFR-10, NFR-11) ----------------

  # Local open language model server (Qwen3, Apache-2.0).
  ollama:
    <<: *restart
    profiles: ["ai"]
    image: ollama/ollama:0.40.6@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot: download, convert and check the models (skipped when already installed).
  ai-models:
    profiles: ["ai"]
    build:
      context: ../services/ai
      target: models
    image: ehimaya/ai-models:dev
    restart: "no"
    command: ["--profile", "${AI_MODEL_PROFILE:-cpu}", "--out", "/models", "--ollama", "http://ollama:11434"]
    volumes:
      - aimodels:/models
    depends_on:
      ollama:
        condition: service_healthy

  # Inference service: speech-to-text, translation, embeddings, structured reading. Internal only.
  ai:
    <<: *restart
    profiles: ["ai"]
    build:
      context: ../services/ai
      target: runtime
    image: ehimaya/ai:dev
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN}
      AI_OLLAMA_URL: http://ollama:11434
      AI_LLM_MODEL: ${AI_LLM_MODEL:-qwen3:4b}
      AI_MEDIA_URL_PREFIX: http://seaweedfs:8333/
      AI_DEVICE: ${AI_DEVICE:-auto}
    volumes:
      - aimodels:/models:ro
    depends_on:
      ai-models:
        condition: service_completed_successfully

  # ---------------- Routing engine (phase 7, profile "routing", docs/decision-support.md) ----------------
  # Valhalla (MIT) on OpenStreetMap Tunisia (Geofabrik extract, © OpenStreetMap contributors, ODbL 1.0). Internal only.
  #   docker compose --env-file .env -f infra/compose.yml --profile routing up -d   (and ROUTING_URL=http://routing:8002)

  # One-shot: the graph volume belongs to uid 10002 (prepare writes, the engine reads).
  routing-init:
    profiles: ["routing"]
    image: ghcr.io/valhalla/valhalla:3.9.1@sha256:4fd114eb1d26b8fc2f43bcb3df234c1b63a0bf13c277405e5943d5361dc575de
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown 10002:10002 /data && chmod 0750 /data"]
    volumes:
      - routingdata:/data

  # One-shot: download the pinned extract (refused unless its SHA-256 matches), build the tiles, switch "current".
  # Skips everything when the graph of that checksum is already built.
  routing-prepare:
    profiles: ["routing"]
    image: ghcr.io/valhalla/valhalla:3.9.1@sha256:4fd114eb1d26b8fc2f43bcb3df234c1b63a0bf13c277405e5943d5361dc575de
    restart: "no"
    user: "10002:10002"
    entrypoint: ["/bin/sh", "/routing/prepare.sh"]
    environment:
      ROUTING_OSM_URL: ${ROUTING_OSM_URL:-https://download.geofabrik.de/africa/tunisia-260901.osm.pbf}
      # Not compose-required (profile services are interpolated even when off); prepare.sh refuses to run without it.
      ROUTING_OSM_SHA256: ${ROUTING_OSM_SHA256:-}
      ROUTING_BUILD_THREADS: ${ROUTING_BUILD_THREADS:-2}
    volumes:
      - ./routing/prepare.sh:/routing/prepare.sh:ro
      - routingdata:/data
      # The extract of the map server (phase M): ROUTING_OSM_URL=file:///sources/tunisia.osm.pbf builds offline.
      - ./maps/data/sources:/sources:ro
    depends_on:
      routing-init:
        condition: service_completed_successfully

  routing:
    <<: *restart
    profiles: ["routing"]
    image: ghcr.io/valhalla/valhalla:3.9.1@sha256:4fd114eb1d26b8fc2f43bcb3df234c1b63a0bf13c277405e5943d5361dc575de
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    entrypoint: ["valhalla_service"]
    command: ["/data/current/valhalla.json", "${ROUTING_THREADS:-2}"]
    volumes:
      - routingdata:/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8002/status"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      routing-prepare:
        condition: service_completed_successfully

  # ---------------- The Office's map server (phase M, docs/offline-maps.md) ----------------
  # Vector tiles of Tunisia, the e-Himaya styles (streets, labels over imagery) and the satellite imagery, all from
  # infra/maps/data on this machine: no request leaves the Office's network once prepared. Data © OpenStreetMap
  # contributors (ODbL 1.0); never committed (infra/maps/data is ignored).
  #   1. On a machine with internet: docker compose -f infra/compose.yml --profile maps-prepare run --rm maps-tiles
  #      (then maps-fonts and maps-satellite), or copy a prepared infra/maps/data folder.
  #   2. docker compose --env-file .env -f infra/compose.yml --profile maps up -d   → http://localhost:8091
  maps-tiles:
    profiles: ["maps-prepare"]
    image: ghcr.io/onthegomap/planetiler:0.10.2@sha256:cf32202dbc001a9ab4bc11534b642b13de3798179817da8558e567a3d13dd403
    restart: "no"
    # OpenMapTiles schema with the Arabic, French and English names; the extract and the sea/lake sources are kept
    # in data/sources (the routing engine reads the same extract, profile "routing").
    command:
      - --area=tunisia
      - --download
      - --osm-path=/data/sources/tunisia.osm.pbf
      - --download-dir=/data/sources
      - --output=/data/tunisia.mbtiles
      - --languages=ar,fr,en
      - --force
      - --maxzoom=14
    volumes:
      - ./maps/data:/data
    healthcheck:
      disable: true

  maps-fonts:
    profiles: ["maps-prepare"]
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    restart: "no"
    command: ["python", "-I", "/maps/fetch_fonts.py"]
    environment:
      MAPS_FONTS_SHA256: ${MAPS_FONTS_SHA256:-}
    volumes:
      - ./maps/fetch_fonts.py:/maps/fetch_fonts.py:ro
      - ./maps/data:/data
    healthcheck:
      disable: true

  # Satellite imagery copied into data/satellite.mbtiles (resumable; SAT_COUNT_ONLY=1 estimates the size first).
  maps-satellite:
    profiles: ["maps-prepare"]
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    restart: "no"
    command: ["python", "-I", "/maps/fetch_tiles.py"]
    environment:
      SAT_URL: ${SAT_URL:-}
      SAT_MAX_ZOOM: ${SAT_MAX_ZOOM:-14}
      SAT_ATTRIBUTION: ${SAT_ATTRIBUTION:-}
      SAT_COUNT_ONLY: ${SAT_COUNT_ONLY:-0}
    volumes:
      - ./maps/fetch_tiles.py:/maps/fetch_tiles.py:ro
      - ./maps/data:/data
    healthcheck:
      disable: true

  # Or imagery of the Office's own (orthophotos, Copernicus mosaics) as a GeoTIFF in data/sources/satellite.tif.
  maps-satellite-import:
    profiles: ["maps-prepare"]
    image: ghcr.io/osgeo/gdal:ubuntu-small-3.13.3@sha256:64250faf833c06d4b21afce4c27190039ba7ab58d70f0eebc87cf77d929c0b40
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        gdalwarp -t_srs EPSG:3857 -r bilinear -co TILED=YES /data/sources/satellite.tif /data/sources/satellite-3857.tif &&
        gdal_translate -of MBTILES -co TILE_FORMAT=JPEG -co QUALITY=85 -co ZOOM_LEVEL_STRATEGY=UPPER
        /data/sources/satellite-3857.tif /data/satellite.mbtiles &&
        gdaladdo -r average /data/satellite.mbtiles 2 4 8 16 32 64 128 256 512 1024 2048 4096
    volumes:
      - ./maps/data:/data
    healthcheck:
      disable: true

  maps-config:
    profiles: ["maps"]
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    restart: "no"
    command: ["python", "-I", "/maps/make_config.py"]
    volumes:
      - ./maps/make_config.py:/maps/make_config.py:ro
      - ./maps/styles:/styles:ro
      - ./maps/data:/data
    healthcheck:
      disable: true

  maps:
    <<: *restart
    profiles: ["maps"]
    image: maptiler/tileserver-gl:v5.7.0@sha256:24d0364e1d40da0ae3fb3269f617c26e36a883ad4b7454e5c4064a8795bfc807
    # The address the browsers use (behind Caddy: https://<API_HOST>/maps/), written into every TileJSON and style.
    command: ["--config", "/data/config.json", "--port", "8080", "--public_url", "${MAPS_PUBLIC_URL:-http://localhost:8091/}"]
    volumes:
      - ./maps/styles:/styles:ro
      - ./maps/data:/data:ro
    ports:
      - "127.0.0.1:8091:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
    depends_on:
      maps-config:
        condition: service_completed_successfully

volumes:
  # SIMULATION: generated FCM service account of notify-sim. PRODUCTION: remove with the notify-sim service.
  sensorqueue:
  notifysim:
  # SIMULATION: sample clip of stream-sim.
  simclips:
  # Recording segments between MediaMTX and the API worker (emptied as segments reach S3).
  recordings:
  # Call recordings between Asterisk and the API worker (emptied as recordings reach S3).
  telrecordings:
  visionmodels:
  aimodels:
  ollamadata:
  # Routing graph of Valhalla (built by routing-prepare).
  routingdata:
  # Terrain model (Copernicus DEM GLO-90, converted), written by the `terrain` service, read by the API.
  terrain:
  pgdata:
  valkeydata:
  natsdata:
  # Events library (profile "search"): OpenSearch indices (rebuilt from PostgreSQL by the backfill command), the
  # node's private keys and certificates (never copied out), and its CA certificate (read by the API).
  opensearch-data:
  opensearch-certs:
  opensearch-ca:
  s3data:
