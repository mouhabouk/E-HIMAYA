# ء-حماية / e-Himaya — البنية الأساسية للتطوير والتجربة (المرحلة 1)
# Usage (from repo root):  docker compose --env-file .env -f infra/compose.yml up -d
name: ehimaya

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    build: ./postgres
    image: ehimaya/postgres:17-3.5-pgvector
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      EHIMAYA_DB_NAME: ${EHIMAYA_DB_NAME:-ehimaya}
      EHIMAYA_DB_USER: ${EHIMAYA_DB_USER:-ehimaya}
      EHIMAYA_DB_PASSWORD: ${EHIMAYA_DB_PASSWORD:?set EHIMAYA_DB_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${EHIMAYA_DB_NAME:-ehimaya}"]
      interval: 5s
      timeout: 5s
      retries: 30

  valkey:
    <<: *restart
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:?set VALKEY_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$${VALKEY_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

  nats:
    <<: *restart
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_APP_USER: ${NATS_APP_USER:-ehimaya}
      NATS_APP_PASSWORD: ${NATS_APP_PASSWORD:?set NATS_APP_PASSWORD}
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - natsdata:/data
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for media and evidence (Apache-2.0)
  seaweedfs:
    <<: *restart
    image: chrislusf/seaweedfs:3.97
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sed -e "s|\$${S3_ACCESS_KEY}|$${S3_ACCESS_KEY}|" -e "s|\$${S3_SECRET_KEY}|$${S3_SECRET_KEY}|"
        /etc/seaweedfs/s3.json.template > /tmp/s3.json &&
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
        -master.volumeSizeLimitMB=1024 -volume.max=0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - ./seaweedfs/s3.json.template:/etc/seaweedfs/s3.json.template:ro
      - s3data:/data
    ports:
      - "127.0.0.1:8333:8333"

  keycloak:
    <<: *restart
    image: keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8080}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *restart
    build:
      context: ../services/api
    image: ehimaya/api:dev
    environment:
      DATABASE_URL: postgresql+asyncpg://${EHIMAYA_DB_USER:-ehimaya}:${EHIMAYA_DB_PASSWORD}@postgres:5432/${EHIMAYA_DB_NAME:-ehimaya}
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      NATS_URL: nats://${NATS_APP_USER:-ehimaya}:${NATS_APP_PASSWORD}@nats:4222
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-ehimaya-media}
      # Issuer = public URL in tokens; JWKS fetched over the internal network.
      OIDC_ISSUERS: ${KEYCLOAK_HOSTNAME:-http://localhost:8080}/realms/ehimaya-public,${KEYCLOAK_HOSTNAME:-http://localhost:8080}/realms/ehimaya-staff
      OIDC_JWKS_BASE_URL: http://keycloak:8080
      OIDC_AUDIENCE: ehimaya-api
      ANON_PSEUDONYM_SECRET: ${ANON_PSEUDONYM_SECRET:?set ANON_PSEUDONYM_SECRET}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy

volumes:
  pgdata:
  valkeydata:
  natsdata:
  s3data:
