# ء-حماية / e-Himaya — البنية الأساسية للتطوير والتجربة (المراحل 1 إلى 5)
# Usage (from repo root):  docker compose --env-file .env -f infra/compose.yml up -d
# With the AI layer (downloads the models once, several GB):
#   docker compose --env-file .env -f infra/compose.yml --profile ai up -d
# On a GPU server add: -f infra/compose.gpu.yml
name: ehimaya

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    build: ./postgres
    image: ehimaya/postgres:17-postgis-pgvector
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      EHIMAYA_DB_NAME: ${EHIMAYA_DB_NAME:-ehimaya}
      EHIMAYA_DB_USER: ${EHIMAYA_DB_USER:-ehimaya}
      EHIMAYA_DB_PASSWORD: ${EHIMAYA_DB_PASSWORD:?set EHIMAYA_DB_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${EHIMAYA_DB_NAME:-ehimaya}"]
      interval: 5s
      timeout: 5s
      retries: 30

  valkey:
    <<: *restart
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:?set VALKEY_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$${VALKEY_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

  nats:
    <<: *restart
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_APP_USER: ${NATS_APP_USER:-ehimaya}
      NATS_APP_PASSWORD: ${NATS_APP_PASSWORD:?set NATS_APP_PASSWORD}
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - natsdata:/data
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for media and evidence (Apache-2.0)
  seaweedfs:
    <<: *restart
    image: chrislusf/seaweedfs:3.97
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sed -e "s|\$${S3_ACCESS_KEY}|$${S3_ACCESS_KEY}|" -e "s|\$${S3_SECRET_KEY}|$${S3_SECRET_KEY}|"
        /etc/seaweedfs/s3.json.template > /tmp/s3.json &&
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
        -master.volumeSizeLimitMB=1024 -volume.max=0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - ./seaweedfs/s3.json.template:/etc/seaweedfs/s3.json.template:ro
      - s3data:/data
    ports:
      - "127.0.0.1:8333:8333"

  # One-shot: create the media bucket (the API's S3 identity has no admin rights).
  seaweedfs-init:
    image: chrislusf/seaweedfs:3.97
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for i in $$(seq 1 60); do
        echo "s3.bucket.create -name $${S3_BUCKET_MEDIA}" | weed shell -master=seaweedfs:9333 2>&1 | grep -q "created bucket" && exit 0;
        sleep 2;
        done; echo "bucket creation failed"; exit 1
    environment:
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-ehimaya-media}
    depends_on:
      - seaweedfs

  # Resumable uploads (tus 1.0) straight to S3; every upload is authorized by the API through hooks.
  tusd:
    <<: *restart
    image: tusproject/tusd:v2.8.0
    command:
      - -host=0.0.0.0
      - -port=1080
      - -base-path=/api/v1/uploads/
      - -s3-bucket=${S3_BUCKET_MEDIA:-ehimaya-media}
      - -s3-endpoint=http://seaweedfs:8333
      - -s3-object-prefix=uploads/
      - -disable-download
      - -max-size=314572800
      - -hooks-http=http://api:8000/internal/tusd/hooks/${TUSD_HOOK_SECRET:?set TUSD_HOOK_SECRET}
      - -hooks-enabled-events=pre-create,post-finish,post-terminate
      - -hooks-http-forward-headers=Authorization,X-Device-Key
      - -cors-allow-origin=${TUSD_CORS_ORIGIN_REGEX:-^http://localhost:517[34]$$}
      - -cors-allow-headers=Authorization,X-Device-Key
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: us-east-1
    ports:
      - "127.0.0.1:1080:1080"
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully

  keycloak:
    <<: *restart
    image: keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8080}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *restart
    build:
      context: ../services/api
    image: ehimaya/api:dev
    environment:
      DATABASE_URL: postgresql+asyncpg://${EHIMAYA_DB_USER:-ehimaya}:${EHIMAYA_DB_PASSWORD}@postgres:5432/${EHIMAYA_DB_NAME:-ehimaya}
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      NATS_URL: nats://${NATS_APP_USER:-ehimaya}:${NATS_APP_PASSWORD}@nats:4222
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-ehimaya-media}
      # Pre-signed media links opened by the dashboard in the browser.
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
      # Issuer = public URL in tokens; JWKS fetched over the internal network.
      OIDC_ISSUERS: ${KEYCLOAK_HOSTNAME:-http://localhost:8080}/realms/ehimaya-public,${KEYCLOAK_HOSTNAME:-http://localhost:8080}/realms/ehimaya-staff
      OIDC_JWKS_BASE_URL: http://keycloak:8080
      OIDC_AUDIENCE: ehimaya-api
      ANON_PSEUDONYM_SECRET: ${ANON_PSEUDONYM_SECRET:?set ANON_PSEUDONYM_SECRET}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY}
      TUSD_HOOK_SECRET: ${TUSD_HOOK_SECRET}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      # Institutions portal (phase 4): invitation and certificate verification links, certificate signing.
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-http://localhost:5174}
      CERTIFICATE_SIGNING_KEY: ${CERTIFICATE_SIGNING_KEY:-}
      # AI layer (profile "ai"). Unset: reports are still scored and grouped by the rules.
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      # Notification channels (phase 5). An empty channel is recorded as skipped; the others still go out.
      # E-mail goes to Mailpit by default (development): every message is visible at http://localhost:8025.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-e-Himaya <no-reply@ehimaya.tn>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      # ┏━━ SIMULATION ━━ push and SMS go to notify-sim (emulated FCM HTTP v1 + OAuth, Tunisian SMS gateway)
      # ┃ PRODUCTION: in .env set FCM_SERVICE_ACCOUNT=<base64 -w0 of the key from Firebase console > Project settings >
      # ┃   Service accounts > Generate new private key> (it wins over FCM_SERVICE_ACCOUNT_FILE),
      # ┃   FCM_API_URL=https://fcm.googleapis.com, SMS_HTTP_URL and SMS_HTTP_TOKEN from the SMS provider contract;
      # ┃   then delete the notify-sim service, the volume line and depends_on entry below and the notifysim volume.
      # ┗━━━━━━━━━━━━━━━━
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-/run/notify-sim/fcm-service-account.json}
      FCM_API_URL: ${FCM_API_URL:-http://notify-sim:8090}
      SMS_HTTP_URL: ${SMS_HTTP_URL:-http://notify-sim:8090/sms/send}
      SMS_HTTP_TOKEN: ${SMS_HTTP_TOKEN:-sim-sms-token}
      SMS_SENDER: ${SMS_SENDER:-E-HIMAYA}
    volumes:
      # SIMULATION: the service account generated by notify-sim (read-only). PRODUCTION: remove this line.
      - notifysim:/run/notify-sim:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
      # SIMULATION: remove in production together with the notify-sim service.
      notify-sim:
        condition: service_healthy

  # Development mail catcher (MIT): receives every e-mail the API sends; web UI on http://localhost:8025.
  # In production point SMTP_HOST at the real relay instead.
  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.31.3
    environment:
      MP_MAX_MESSAGES: 5000
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  # ┏━━ SIMULATION ━━ notify-sim: emulates Firebase Cloud Messaging HTTP v1 (OAuth service-account flow) and the HTTP
  # ┃   SMS gateway of a Tunisian operator. Inbox of every push and SMS: http://localhost:8090. Dev/test only.
  # ┃ PRODUCTION: delete this service and the notifysim volume; in .env set FCM_SERVICE_ACCOUNT (Firebase console >
  # ┃   Project settings > Service accounts > Generate new private key, base64 -w0),
  # ┃   FCM_API_URL=https://fcm.googleapis.com, SMS_HTTP_URL / SMS_HTTP_TOKEN (SMS provider contract).
  # ┗━━━━━━━━━━━━━━━━
  notify-sim:
    <<: *restart
    build:
      context: ../services/notify-sim
    image: ehimaya/notify-sim:dev
    environment:
      SIM_DATA_DIR: /data
      SIM_PUBLIC_URL: http://notify-sim:8090
      SIM_FCM_PROJECT: ${SIM_FCM_PROJECT:-ehimaya-sim}
      SIM_SMS_TOKEN: ${SMS_HTTP_TOKEN:-sim-sms-token}
      SIM_SMS_FAIL_NUMBERS: ${SIM_SMS_FAIL_NUMBERS:-+21698000000}
    volumes:
      - notifysim:/data
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------- AI layer 1 (profile "ai"): all models run on our own servers (NFR-10, NFR-11) ----------------

  # Local open language model server (Qwen3, Apache-2.0).
  ollama:
    <<: *restart
    profiles: ["ai"]
    image: ollama/ollama:0.40.1
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot: download, convert and check the models (skipped when already installed).
  ai-models:
    profiles: ["ai"]
    build:
      context: ../services/ai
      target: models
    image: ehimaya/ai-models:dev
    restart: "no"
    command: ["--profile", "${AI_MODEL_PROFILE:-cpu}", "--out", "/models", "--ollama", "http://ollama:11434"]
    volumes:
      - aimodels:/models
    depends_on:
      ollama:
        condition: service_healthy

  # Inference service: speech-to-text, translation, embeddings, structured reading. Internal only.
  ai:
    <<: *restart
    profiles: ["ai"]
    build:
      context: ../services/ai
      target: runtime
    image: ehimaya/ai:dev
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN}
      AI_OLLAMA_URL: http://ollama:11434
      AI_LLM_MODEL: ${AI_LLM_MODEL:-qwen3:4b}
      AI_MEDIA_URL_PREFIX: http://seaweedfs:8333/
      AI_DEVICE: ${AI_DEVICE:-auto}
    volumes:
      - aimodels:/models:ro
    depends_on:
      ai-models:
        condition: service_completed_successfully

volumes:
  # SIMULATION: generated FCM service account of notify-sim. PRODUCTION: remove with the notify-sim service.
  notifysim:
  aimodels:
  ollamadata:
  pgdata:
  valkeydata:
  natsdata:
  s3data:
