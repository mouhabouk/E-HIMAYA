# Release overlay (CI/CD, docs/cicd.md): the server runs the images the release workflow built, scanned, signed and
# pushed to the registry, instead of building them. Use on top of compose.yml and compose.prod.yml:
#
#   EHIMAYA_VERSION=v1.2.0 docker compose -f infra/compose.yml -f infra/compose.prod.yml -f infra/compose.release.yml ...
#
# scripts/deploy.sh does it for you. The dashboard and the portal stay built on the server: their addresses and
# content security policy are baked in at build time from the server's own .env.
services:
  postgres:
    image: ${EHIMAYA_REGISTRY:-ghcr.io/mouhabouk}/ehimaya-postgres:${EHIMAYA_VERSION:?set EHIMAYA_VERSION}
    build: !reset null
    pull_policy: missing
  db-roles:
    image: ${EHIMAYA_REGISTRY:-ghcr.io/mouhabouk}/ehimaya-postgres:${EHIMAYA_VERSION:?set EHIMAYA_VERSION}
