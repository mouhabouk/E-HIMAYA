# e-Himaya login theme (phase A, addition 1): Keycloak's own pages (institution sign-in, staff sign-in, password
# reset) wear the Office's logo and colours. Everything else comes from keycloak.v2.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/ehimaya.css
# The card stays white on the night navy whatever the system theme (Yamen, 2026-11-08).
darkMode=false
# The language as gold circles (resources/js/languages.js); the parent has no scripts of its own.
scripts=js/languages.js
locales=ar,fr,en
