# Alertmanager (phase 10 §2.3): e-mail by default. ${...} are filled in from the environment by render-alertmanager.sh.
global:
  smtp_smarthost: "${SMTP_HOST}:${SMTP_PORT}"
  smtp_from: "${ALERT_EMAIL_FROM}"
  smtp_auth_username: "${SMTP_USERNAME}"
  smtp_auth_password: "${SMTP_PASSWORD}"
  smtp_require_tls: true

route:
  receiver: on-call
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical alerts (SOS intake, backups): repeated every hour until resolved.
    - matchers: [severity="critical"]
      receiver: on-call
      repeat_interval: 1h

receivers:
  - name: on-call
    email_configs:
      - to: "${ALERT_EMAIL_TO}"
        send_resolved: true

inhibit_rules:
  # An instance that is down explains its other alerts.
  - source_matchers: [alertname="InstanceDown"]
    target_matchers: [severity="warning"]
    equal: [instance]
