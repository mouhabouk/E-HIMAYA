# Prometheus (phase 10 §2.3, NFR-13), profile "monitoring" of compose.prod.yml. Internal network only.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The API and the worker (GET /metrics with METRICS_TOKEN; 404 without it).
  - job_name: api
    authorization:
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]
  - job_name: worker
    authorization:
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["worker:8000"]
  - job_name: mediamtx
    basic_auth:
      username: ehimaya-api
      password_file: /etc/prometheus/secrets/mediamtx_api_password
    static_configs:
      - targets: ["mediamtx:9998"]
  # Keycloak management interface (KC_METRICS_ENABLED).
  - job_name: keycloak
    static_configs:
      - targets: ["keycloak:9000"]
  # Backup textfile metrics written by the backup service (archive lag, last base backup).
  - job_name: backup
    static_configs:
      - targets: ["backup-metrics:9100"]
