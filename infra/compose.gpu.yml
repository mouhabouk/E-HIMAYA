# GPU server override (NVIDIA container toolkit required):
#   docker compose --env-file .env -f infra/compose.yml -f infra/compose.gpu.yml --profile ai up -d
# Whisper large-v3 and Qwen3 8B (profile "prod" of services/ai/models/fetch_models.py).
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  ai-models:
    command: ["--profile", "prod", "--out", "/models", "--ollama", "http://ollama:11434"]
  ai:
    build:
      args:
        GPU: "1"
    environment:
      AI_LLM_MODEL: qwen3:8b
      AI_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
