# ء-حماية / e-Himaya — production overlay (docs/deploy-production.md).
#   docker compose --env-file .env -f infra/compose.yml -f infra/compose.prod.yml up -d --build
# On top of the development file it:
#   - puts Caddy in front of everything (TLS: ACME certificates for real domains, or `tls internal` for a demo),
#     and publishes only ports 80/443: no database, Valkey, NATS, S3, tusd, Keycloak or API port on the host;
#   - runs Keycloak in production mode (`start`, hostname, proxy headers, health on the management port);
#   - builds the dashboard and the portal as static images with their CSP;
#   - runs the API as two processes (api: HTTP only, worker: background loops) with APP_ENV=production, which hides
#     /docs and refuses example secrets at start-up;
#   - leaves out the development helpers mailpit and notify-sim (profile "dev-tools", never started here);
#   - live streaming: WHIP/WHEP and HLS through Caddy on API_HOST (/live/<id>/...), WebRTC media on 8189/udp, and
#     RTSP 8554 / RTMP 1935 for registered drones and cameras: the only ports published besides Caddy's
#     (docs/streaming.md: restrict 8554/1935 to the camera networks in the host firewall);
#   - telephony: the softphone's SIP over WebSocket through Caddy (wss://API_HOST/telephony/ws, nothing else of
#     Asterisk), SIP 5060/5061 for the operator's trunk and the RTP range for media (docs/telephony.md: restrict SIP to
#     the operator's SBC addresses in the host firewall); ARI stays internal; the call simulator is never started.
# Required in .env on top of the development ones: API_HOST, DASHBOARD_HOST, PORTAL_HOST, AUTH_HOST, MEDIA_HOST,
# CADDY_TLS, EHIMAYA_DB_RUNTIME_PASSWORD, SMTP_HOST, real FCM/SMS settings (or empty to skip those channels),
# MEDIAMTX_HOOK_TOKEN and MEDIAMTX_API_PASSWORD (random), MEDIAMTX_WEBRTC_HOSTS when API_HOST is not this server,
# TELEPHONY_ARI_PASSWORD (random), TELEPHONY_EXTERNAL_HOST when API_HOST is not this server's public address, the
# TELEPHONY_TRUNK_* settings of the operator and SMS_INBOUND_SECRET agreed with the SMS gateway (docs/telephony.md),
# OPENSEARCH_ADMIN_PASSWORD and OPENSEARCH_PASSWORD (random, distinct; events library, phase 8).

# Settings shared by the api, worker and migrate containers in production.
x-api-prod-env: &api-prod-env
  APP_ENV: production
  OIDC_ISSUERS: https://${AUTH_HOST:?set AUTH_HOST}/realms/ehimaya-public,https://${AUTH_HOST}/realms/ehimaya-staff
  OIDC_JWKS_BASE_URL: http://keycloak:8080
  S3_PUBLIC_ENDPOINT_URL: https://${MEDIA_HOST:?set MEDIA_HOST}
  PORTAL_PUBLIC_URL: https://${PORTAL_HOST:?set PORTAL_HOST}
  # QR code of reward certificates (phase 8): public verification on the API host.
  API_PUBLIC_URL: https://${API_HOST}
  API_CORS_ORIGINS: https://${DASHBOARD_HOST:?set DASHBOARD_HOST},https://${PORTAL_HOST}
  DATABASE_URL: postgresql+asyncpg://${EHIMAYA_DB_RUNTIME_USER:-ehimaya_app}:${EHIMAYA_DB_RUNTIME_PASSWORD:?set EHIMAYA_DB_RUNTIME_PASSWORD}@postgres:5432/${EHIMAYA_DB_NAME:-ehimaya}
  # Only the edge proxy (fixed address below) may set X-Forwarded-For: per-address limits see real clients.
  FORWARDED_ALLOW_IPS: ${EDGE_PROXY_IP:-172.31.250.10}
  # Real channels only: empty values are recorded as "skipped" (no simulator in production).
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
  FCM_API_URL: ${FCM_API_URL:-https://fcm.googleapis.com}
  SMS_HTTP_URL: ${SMS_HTTP_URL:-}
  SMS_HTTP_TOKEN: ${SMS_HTTP_TOKEN:-}
  # Live streaming: phones and the dashboard reach MediaMTX through Caddy; drones and cameras on STREAM_INGEST_HOST.
  STREAM_WEBRTC_PUBLIC_URL: https://${API_HOST}
  STREAM_HLS_PUBLIC_URL: https://${API_HOST}
  STREAM_INGEST_HOST: ${STREAM_INGEST_HOST:-${API_HOST}}
  # SIMULATION never runs in production (the API refuses to start with a sim token).
  STREAM_SIM_TOKEN: ""
  # Telephony: the dashboard softphone registers over WSS through Caddy; no call simulator.
  TELEPHONY_WS_PUBLIC_URL: wss://${API_HOST}/telephony/ws
  TELEPHONY_SIM_TOKEN: ""
  # Call recording only once the processing is declared to the INPDP (legal point L04): explicit opt-in.
  TELEPHONY_RECORDING_ENABLED: ${TELEPHONY_RECORDING_ENABLED:-false}
  # Events library (phase 8): OpenSearch always runs in production; PostgreSQL answers while it is down.
  OPENSEARCH_URL: https://opensearch:9200
  OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:?set OPENSEARCH_PASSWORD}

x-api-prod-deps: &api-prod-deps
  migrate:
    condition: service_completed_successfully
  valkey:
    condition: service_healthy
  nats:
    condition: service_healthy

services:
  # ---------------- edge: the only published ports ----------------
  caddy:
    image: caddy:2.11-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:?set API_HOST}
      DASHBOARD_HOST: ${DASHBOARD_HOST}
      PORTAL_HOST: ${PORTAL_HOST}
      AUTH_HOST: ${AUTH_HOST}
      MEDIA_HOST: ${MEDIA_HOST}
      # "internal" = certificates from Caddy's own CA (demo, test domains); an e-mail address = Let's Encrypt/ZeroSSL.
      CADDY_TLS: ${CADDY_TLS:-internal}
      # Who may open the Keycloak admin console (CIDRs, space-separated). Default: private networks only.
      KEYCLOAK_ADMIN_ALLOW: ${KEYCLOAK_ADMIN_ALLOW:-private_ranges}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks:
      default:
        ipv4_address: ${EDGE_PROXY_IP:-172.31.250.10}
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      portal:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
      telephony:
        condition: service_healthy

  dashboard:
    build:
      context: ../apps/dashboard
      additional_contexts:
        web: ./web
      args:
        VITE_API_BASE_URL: https://${API_HOST}
        VITE_OIDC_ISSUER: https://${AUTH_HOST}/realms/ehimaya-staff
        VITE_OIDC_CLIENT_ID: ehimaya-dashboard
        VITE_MAP_STYLE_URL: ${MAP_STYLE_URL:-}
        CSP_MAP_SRC: ${CSP_MAP_SRC:-}
        CSP_MEDIA_SRC: https://${MEDIA_HOST}
        # WHEP/HLS playback of live streams, served by Caddy on the API host (infra/caddy/Caddyfile, /live/*).
        CSP_STREAM_SRC: https://${API_HOST}
        # Softphone (SIP over WebSocket to Asterisk), served by Caddy on the API host (/telephony/ws).
        CSP_TELEPHONY_SRC: wss://${API_HOST}
        # Permissions-Policy microphone=(self): the softphone's microphone, on the dashboard origin only.
        CSP_MICROPHONE: self
    image: ehimaya/dashboard:prod
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]

  portal:
    build:
      context: ../apps/portal
      additional_contexts:
        web: ./web
      args:
        VITE_API_BASE_URL: https://${API_HOST}
        VITE_OIDC_ISSUER: https://${AUTH_HOST}/realms/ehimaya-public
        VITE_OIDC_CLIENT_ID: ehimaya-portal
        VITE_TUS_ENDPOINT: https://${API_HOST}/api/v1/uploads/
        VITE_MAP_STYLE_URL: ${MAP_STYLE_URL:-}
        CSP_MAP_SRC: ${CSP_MAP_SRC:-}
        CSP_MEDIA_SRC: https://${MEDIA_HOST}
    image: ehimaya/portal:prod
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]

  # ---------------- application ----------------
  api:
    environment:
      <<: *api-prod-env
      PROCESS_ROLE: api
      # uvicorn processes per api container (one Python process saturates one core; infra/loadtest/RESULTS.md).
      WEB_CONCURRENCY: ${API_WORKERS:-4}
    ports: !reset []
    # No simulator volume and no dependency on notify-sim; the terrain model of the spread forecasts (read-only).
    volumes: !override
      - terrain:/terrain:ro
      - opensearch-ca:/opensearch-ca:ro
    depends_on: !override
      <<: *api-prod-deps

  # Background loops (outbox relay, media verification, AI analysis, notification delivery, retention). Never routed
  # by Caddy; serves only /health and /metrics on the internal network. Exactly one replica.
  worker:
    extends:
      file: compose.yml
      service: api
    environment:
      <<: *api-prod-env
      PROCESS_ROLE: worker
      WEB_CONCURRENCY: "1"
    ports: !reset []
    # Only the recordings volumes (segment and call recording ingestion run here) and the procedures library (indexed here for the
    # incident assistant, docs/decision-support.md); no simulator volume.
    volumes: !override
      - recordings:/recordings
      # Call recordings written by Asterisk (ingestion runs here).
      - telrecordings:/telephony-recordings
      - ../docs/procedures:/app/procedures:ro
      # CA of the OpenSearch node (the "knowledge" loop indexes the events library).
      - opensearch-ca:/opensearch-ca:ro
    depends_on: !override
      <<: *api-prod-deps

  migrate:
    environment:
      <<: *api-prod-env
    volumes: !reset []

  keycloak:
    # Production mode: HTTPS terminated by Caddy, plain HTTP on the internal network only.
    command: ["start", "--import-realm"]
    environment:
      KC_HOSTNAME: https://${AUTH_HOST}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "true"
    ports: !reset []
    healthcheck:
      # The image has no curl: plain bash on the management port (9000).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  tusd:
    # Browsers reach tusd only through Caddy (https://API_HOST/api/v1/uploads/). Its hook URL (with the hook secret)
    # stays on the internal network; tusd prints that URL in its start-up log, so its logs are confidential.
    command:
      - -host=0.0.0.0
      - -port=1080
      - -base-path=/api/v1/uploads/
      - -behind-proxy
      - -s3-bucket=${S3_BUCKET_MEDIA:-ehimaya-media}
      - -s3-endpoint=http://seaweedfs:8333
      - -s3-object-prefix=uploads/
      - -disable-download
      - -max-size=314572800
      - -hooks-http=http://tusd:${TUSD_HOOK_SECRET:?set TUSD_HOOK_SECRET}@api:8000/internal/tusd/hooks
      - -hooks-enabled-events=pre-create,post-finish,post-terminate
      # e.g. ^https://(dashboard|portal)\.ehimaya\.tn$$ (dots escaped)
      - -cors-allow-origin=${TUSD_CORS_ORIGIN_REGEX:?set TUSD_CORS_ORIGIN_REGEX to the dashboard and portal origins}
      - -cors-allow-headers=Authorization,X-Device-Key
    ports: !reset []

  mediamtx:
    environment:
      # ICE candidates announced to phones and browsers: the public IP (or a name resolving to it) of this server.
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_HOSTS:-${API_HOST}}
      MTX_WEBRTCIPSFROMINTERFACES: "false"
      # Signalling and HLS arrive through Caddy: its address is trusted for X-Forwarded-For (client address in the
      # auth log), and only the dashboard origin may call WHEP/HLS from a browser (phones use WHIP natively).
      MTX_WEBRTCTRUSTEDPROXIES: ${EDGE_PROXY_IP:-172.31.250.10}
      MTX_HLSTRUSTEDPROXIES: ${EDGE_PROXY_IP:-172.31.250.10}
      MTX_WEBRTCALLOWORIGINS: https://${DASHBOARD_HOST}
      MTX_HLSALLOWORIGINS: https://${DASHBOARD_HOST}
    ports: !override
      # WebRTC media (ICE over UDP) from phones and to the dashboard.
      - "8189:8189/udp"
      # Ingest of registered drones and fixed cameras (token per source). Firewall these to the camera networks.
      - "8554:8554"
      - "1935:1935"

  telephony:
    environment:
      # Address announced to the trunk and to browsers (SDP, ICE): the public IP or a name resolving to it.
      TELEPHONY_EXTERNAL_HOST: ${TELEPHONY_EXTERNAL_HOST:-${API_HOST}}
      # No simulator endpoint in production.
      TELEPHONY_SIM_PASSWORD: ""
      TELEPHONY_RECORDING_ENABLED: ${TELEPHONY_RECORDING_ENABLED:-false}
    ports: !override
      # SIP trunk of the operator (UDP/TCP, TLS on 5061). Firewall these to the operator's SBC addresses.
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5061:5061/tcp"
      # RTP media of trunk calls and of the dashboard softphones (DTLS-SRTP).
      - "${TELEPHONY_RTP_START:-10000}-${TELEPHONY_RTP_END:-10099}:${TELEPHONY_RTP_START:-10000}-${TELEPHONY_RTP_END:-10099}/udp"

  # No published port: data services are reached only on the internal network.
  postgres:
    ports: !reset []
  valkey:
    ports: !reset []
  nats:
    ports: !reset []
  seaweedfs:
    ports: !reset []
  # Events library search: always on in production (no profile), never published, passwords required.
  opensearch-init:
    profiles: !reset []
  opensearch:
    profiles: !reset []
    environment:
      OPENSEARCH_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?set OPENSEARCH_ADMIN_PASSWORD}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:?set OPENSEARCH_PASSWORD}
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g}
    mem_limit: ${OPENSEARCH_MEM_LIMIT:-2g}

  # Development helpers, never started in production (no profile "dev-tools" is enabled here).
  mailpit:
    profiles: ["dev-tools"]
    ports: !reset []
  notify-sim:
    profiles: ["dev-tools"]
    ports: !reset []
  # SIMULATION: the simulated camera is development-only (the API refuses its token in production anyway).
  stream-sim:
    profiles: !override ["dev-tools"]
  # SIMULATION: the call simulator is development-only (no simulator endpoint exists in production).
  call-sim:
    profiles: !override ["dev-tools"]

networks:
  default:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.31.250.0/24}
          # Dynamic addresses come from the upper half, so the edge proxy's fixed address is never taken.
          ip_range: ${EDGE_DYNAMIC_RANGE:-172.31.250.128/25}

volumes:
  caddydata:
  caddyconfig:
