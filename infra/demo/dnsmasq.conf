# ء-حماية / e-Himaya — local names of the demonstration (docs/demo.md §2), for dnsmasq on the demonstration computer
# (sudo apt install dnsmasq, installed before the day; then copy this file to /etc/dnsmasq.d/ehimaya-demo.conf,
# replace 192.168.50.10 with DEMO_LAN_IP and run sudo systemctl restart dnsmasq). The phones take the computer's
# address as their DNS server in the Wi-Fi settings (static IP), or the Wi-Fi router hands it out by DHCP.
# Every *.ehimaya.demo name answers the computer; no other name is resolved (no Internet).
address=/ehimaya.demo/192.168.50.10
no-resolv
listen-address=192.168.50.10
bind-interfaces
