# Loki (profile "logs" of compose.prod.yml; docs/phase-h/design-h5.md §1): the logs of every container, kept 30 days.
# Single process, file storage on the "lokidata" volume, internal network only (nothing published). The API reads it
# for the system administrator's window (LOKI_URL); nothing else needs to reach it.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-11-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h
  # Labels are few on purpose (service, level, container): the request id stays in the line, never a label.
  max_label_names_per_series: 8
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
