name: Mobile

on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - .github/workflows/mobile.yml
  pull_request:
    paths:
      - apps/mobile/**
      - .github/workflows/mobile.yml

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile · analyze, test, build
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # Host tests open the system SQLite (pubspec hooks: `default: system`); Android builds
      # bundle SQLCipher through package:sqlite3's build hook.
      - name: System SQLite for host tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Free runner disk space
        # The hosted image ships ~30 GB of toolchains the APK build never uses. Hosted runners only: on a
        # self-hosted runner (vars.RUNNER) these are the owner's own directories.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          df -h /

      - name: Build debug APK
        run: flutter build apk --debug
