name: Portal

on:
  push:
    branches: [main]
    paths:
      - "apps/portal/**"
      - ".github/workflows/portal.yml"
  pull_request:
    paths:
      - "apps/portal/**"
      - ".github/workflows/portal.yml"

permissions:
  contents: read

concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    name: Portal · lint, types, tests, build, browser tests
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Phase 10 §6.5: axe-core on the production bundle, Arabic and French.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: portal-playwright-report
          path: |
            apps/portal/playwright-report/
            apps/portal/test-results/
          retention-days: 7
