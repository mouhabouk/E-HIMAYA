name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, types, migrations, tests
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: services/api
    env:
      # Tests connect as the owner (they also check the triggers); the runtime role is exercised by
      # tests/test_db_roles.py and by the "API on the runtime role" step below.
      DATABASE_URL: postgresql+asyncpg://ehimaya:ehimaya-ci@localhost:5432/ehimaya
      RUNTIME_DATABASE_URL: postgresql+asyncpg://ehimaya_app:ehimaya-app-ci@localhost:5432/ehimaya
      DB_RUNTIME_ROLE: ehimaya_app
      ANON_PSEUDONYM_SECRET: ci-only-secret-ci-only-secret-ci-only-01
      FIELD_ENCRYPTION_KEY: Y2ktb25seS1rZXktY2ktb25seS1rZXktY2ktb25seTE=
    steps:
      - uses: actions/checkout@v4

      - name: Build database image (PostgreSQL + PostGIS + pgvector)
        working-directory: infra/postgres
        run: docker build -t ehimaya/postgres:ci .

      - name: Start database
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres-ci \
            -e EHIMAYA_DB_NAME=ehimaya -e EHIMAYA_DB_USER=ehimaya -e EHIMAYA_DB_PASSWORD=ehimaya-ci \
            -e EHIMAYA_DB_RUNTIME_USER=ehimaya_app -e EHIMAYA_DB_RUNTIME_PASSWORD=ehimaya-app-ci \
            -e KEYCLOAK_DB_NAME=keycloak -e KEYCLOAK_DB_USER=keycloak -e KEYCLOAK_DB_PASSWORD=keycloak-ci \
            ehimaya/postgres:ci
          for i in $(seq 1 60); do
            if docker exec pg psql -U ehimaya -d ehimaya -tAc "SELECT extname FROM pg_extension WHERE extname='vector'" 2>/dev/null | grep -q vector; then
              echo "database ready"; exit 0
            fi
            sleep 2
          done
          docker logs pg; exit 1

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Validate procedures library
        working-directory: services/api
        run: uv run python -m app.modules.decision.cli check ../../docs/procedures

      # Two roles (A4): alembic connects with MIGRATION_DATABASE_URL (owner) while DATABASE_URL is the runtime role,
      # and grants the runtime role its privileges after the upgrade.
      - name: Migrate as the owner (up, down, up)
        env:
          MIGRATION_DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_URL: ${{ env.RUNTIME_DATABASE_URL }}
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Runtime role cannot migrate
        env:
          DATABASE_URL: ${{ env.RUNTIME_DATABASE_URL }}
        run: |
          if uv run alembic downgrade -1; then echo "the runtime role was able to change the schema"; exit 1; fi

      - name: API on the runtime role (anonymous consent + report)
        env:
          DATABASE_URL: ${{ env.RUNTIME_DATABASE_URL }}
          BACKGROUND_WORKERS: "false"
        run: |
          uv run uvicorn app.main:app --port 8000 > api.log 2>&1 &
          API_PID=$!
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health/ready && break; sleep 1; done
          KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/consents -H "X-Device-Key: $KEY" -H 'Content-Type: application/json' \
            -d '{"charter_version":"2026-10","locale":"ar","platform":"android"}'
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/reports -H "X-Device-Key: $KEY" -H 'Content-Type: application/json' \
            -d "{\"client_uuid\":\"$(cat /proc/sys/kernel/random/uuid)\",\"category\":\"sos\",\"location\":{\"lat\":36.8,\"lon\":10.18},\"created_at\":\"$(date -u +%FT%TZ)\"}"
          kill $API_PID; tail -20 api.log

      - name: Tests
        run: uv run pytest -q

      # Events library (phase 8): the knowledge tests again, against a real OpenSearch node started with the
      # production entrypoint (own CA, security plugin, generated passwords). Disk watermarks off: CI runner disks are
      # often fuller than the 85 % OpenSearch allows.
      - name: Events library tests against OpenSearch
        env:
          OPENSEARCH_URL: https://localhost:9200
          OPENSEARCH_USER: ehimaya
          OPENSEARCH_CA_FILE: ${{ runner.temp }}/opensearch-ca/ca.pem
        run: |
          OPENSEARCH_ADMIN_PASSWORD=$(openssl rand -hex 24); export OPENSEARCH_PASSWORD=$(openssl rand -hex 24)
          IMAGE=opensearchproject/opensearch:2.19.6@sha256:be67c71b8d0e5edf1e9825145501c0136c3b8221206e1ce782ce17b04d0280b5
          docker volume create os-certs && docker volume create os-ca
          docker run --rm --user 0:0 -v os-certs:/certs -v os-ca:/ca --entrypoint /bin/sh "$IMAGE" \
            -c "chown 1000:1000 /certs /ca && chmod 0700 /certs"
          docker run -d --name opensearch -p 127.0.0.1:9200:9200 \
            -v "$GITHUB_WORKSPACE/infra/opensearch/ehimaya-entrypoint.sh:/usr/local/bin/ehimaya-entrypoint.sh:ro" \
            -v os-certs:/usr/share/opensearch/config/certs -v os-ca:/opensearch-ca \
            -e OPENSEARCH_ADMIN_PASSWORD="$OPENSEARCH_ADMIN_PASSWORD" -e OPENSEARCH_PASSWORD="$OPENSEARCH_PASSWORD" \
            -e OPENSEARCH_USER=ehimaya -e OPENSEARCH_JAVA_OPTS="-Xms512m -Xmx512m" \
            -e DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true -e cluster.routing.allocation.disk.threshold_enabled=false \
            --entrypoint /bin/bash "$IMAGE" /usr/local/bin/ehimaya-entrypoint.sh
          mkdir -p "$(dirname "$OPENSEARCH_CA_FILE")"
          for i in $(seq 1 60); do
            if docker cp opensearch:/opensearch-ca/ca.pem "$OPENSEARCH_CA_FILE" 2>/dev/null \
              && curl -fs --cacert "$OPENSEARCH_CA_FILE" -u "ehimaya:$OPENSEARCH_PASSWORD" \
                "$OPENSEARCH_URL/_cluster/health?wait_for_status=yellow&timeout=4s" >/dev/null; then
              echo "opensearch ready"; break
            fi
            if [ "$i" = 60 ]; then docker logs opensearch | tail -50; exit 1; fi
            sleep 5
          done
          uv run pytest -q tests/test_knowledge.py

  api-image:
    name: API · container image
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ehimaya/api:ci services/api

  # Supply chain (A9): every image we build is scanned; a CRITICAL vulnerability with a fix available fails CI.
  image-scan:
    name: Images · build and Trivy scan
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: services/api, args: "" }
          - { name: notify-sim, context: services/notify-sim, args: "" }
          - { name: ai, context: services/ai, args: "--target runtime" }
          - { name: vision, context: services/vision, args: "--target runtime" }
          - { name: postgres, context: infra/postgres, args: "" }
          - { name: dashboard, context: apps/dashboard, args: "--build-context web=infra/web" }
          - { name: portal, context: apps/portal, args: "--build-context web=infra/web" }
          - { name: telephony, context: services/telephony, args: "--target runtime" }
          - { name: call-sim, context: services/telephony, args: "--target call-sim" }
    env:
      # Allow-listed secret findings (each one justified in the file).
      TRIVY_SECRET_CONFIG: .github/trivy-secret.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build ${{ matrix.args }} -t ehimaya/${{ matrix.name }}:scan ${{ matrix.context }}
      - name: Trivy (fail on CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ehimaya/${{ matrix.name }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Trivy report (HIGH and CRITICAL, informational)
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ehimaya/${{ matrix.name }}:scan
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          skip-setup-trivy: true

  # Telephony (phase 7, docs/telephony.md): the Asterisk image starts as its unprivileged user, loads the modules the
  # platform relies on, renders its dialplan (recorded-call notice before recording and queueing), refuses a missing
  # ARI password, and a simulated call reaches the operators queue.
  telephony:
    name: Telephony · Asterisk image
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (runtime and call-sim)
        run: |
          docker build --target runtime -t ehimaya/telephony:ci services/telephony
          docker build --target call-sim -t ehimaya/call-sim:ci services/telephony
      - name: Refuses to start without an ARI password
        run: |
          if docker run --rm ehimaya/telephony:ci true 2> err.txt; then echo "started without TELEPHONY_ARI_PASSWORD"; exit 1; fi
          grep -q "TELEPHONY_ARI_PASSWORD is required" err.txt
      - name: Start Asterisk and call-sim
        run: |
          docker network create tel
          docker run -d --name telephony --network tel -p 127.0.0.1:8088:8088 \
            -e TELEPHONY_ARI_PASSWORD=ci-ari-password-0123456789 -e TELEPHONY_SIM_PASSWORD=ci-sim-password-0123456789 \
            ehimaya/telephony:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' telephony)" = healthy ] && break; sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' telephony | grep -qx healthy
      - name: Version, user, modules, dialplan, ARI
        run: |
          ast() { docker exec telephony asterisk -C /run/asterisk/etc/asterisk.conf -rx "$1"; }
          ast "core show version" | tee version.txt
          grep -q "^Asterisk 22\." version.txt
          [ "$(docker exec telephony id -u)" = 10001 ]
          for module in chan_pjsip res_pjsip_transport_websocket res_srtp app_queue app_mixmonitor app_confbridge \
                        res_ari res_ari_channels res_ari_asterisk res_stasis res_pjsip_header_funcs \
                        res_clioriginate codec_alaw format_wav; do
            ast "module show like $module" | grep -q "^$module.so .*Running" || { echo "module $module not running"; exit 1; }
          done
          # No module outside the curated set (chan_sip, AMI clients, CDR back-ends ...).
          if ast "module show" | grep -E "^(chan_sip|chan_iax2|cdr_|cel_|res_config_)"; then exit 1; fi
          ast "pjsip show transports" | grep -q "transport-wss"
          # The recorded-call notice plays before MixMonitor and before the queue (legal point L04).
          ast "dialplan show 8000@ehimaya-entry" > entry.txt
          notice=$(grep -n "notice-ar&ehimaya/notice-fr" entry.txt | cut -d: -f1)
          monitor=$(grep -n "MixMonitor" entry.txt | cut -d: -f1)
          queue=$(grep -n "Queue(operators" entry.txt | head -1 | cut -d: -f1)
          [ -n "$notice" ] && [ "$notice" -lt "$monitor" ] && [ "$monitor" -lt "$queue" ]
          docker exec telephony test -s /var/lib/asterisk/sounds/ehimaya/notice-ar.wav
          docker exec telephony test -s /var/lib/asterisk/sounds/ehimaya/notice-fr.wav
          curl -fsS -u ehimaya-api:ci-ari-password-0123456789 http://127.0.0.1:8088/ari/asterisk/info | grep -q '"version":"22\.'
          [ "$(curl -s -o /dev/null -w '%{http_code}' -u ehimaya-api:wrong-password-0000 http://127.0.0.1:8088/ari/asterisk/info)" = 401 ]
      - name: Recording can be switched off
        run: |
          docker run -d --name norec -e TELEPHONY_ARI_PASSWORD=ci-ari-password-0123456789 \
            -e TELEPHONY_RECORDING_ENABLED=false ehimaya/telephony:ci
          sleep 8
          docker logs norec 2>&1 | grep -q "recording=0"
          docker rm -f norec
      - name: A simulated call reaches the operators queue after the notice
        run: |
          docker run -d --name call-sim --network tel -e TELEPHONY_SIM_PASSWORD=ci-sim-password-0123456789 \
            -e CALL_SIM_FIRST_DELAY_S=2 -e CALL_SIM_TALK_S=40 -e CALL_SIM_INTERVAL_S=600 ehimaya/call-sim:ci
          for i in $(seq 1 45); do
            docker exec telephony asterisk -C /run/asterisk/etc/asterisk.conf -rx "queue show operators" | grep -q "PJSIP/call-sim" && break
            sleep 1
          done
          docker exec telephony asterisk -C /run/asterisk/etc/asterisk.conf -rx "queue show operators" | tee queue.txt
          grep -q "PJSIP/call-sim" queue.txt
          # Recording started (after the notice) for that call.
          docker exec telephony sh -c 'ls /var/spool/asterisk/ehimaya/*.wav'
      - name: Logs on failure
        if: failure()
        run: |
          docker logs telephony 2>&1 | tail -100
          docker logs call-sim 2>&1 | tail -50 || true

  # ┏━━ SIMULATION ━━ notify-sim: development emulator of Firebase Cloud Messaging (HTTP v1 + OAuth) and the SMS gateway
  # ┃ PRODUCTION: these two jobs only check the simulator; when it is removed from the repository, delete them. The
  # ┃   real FCM_SERVICE_ACCOUNT / FCM_API_URL / SMS_HTTP_URL / SMS_HTTP_TOKEN are never used in CI.
  # ┗━━━━━━━━━━━━━━━━
  notify-sim:
    name: Notify simulator · lint, types, tests
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: services/notify-sim
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Tests
        run: uv run pytest -q

  notify-sim-image:
    name: Notify simulator · container image
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ehimaya/notify-sim:ci services/notify-sim
      - name: Starts healthy and writes the service account
        run: |
          docker run -d --name sim ehimaya/notify-sim:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' sim)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' sim | grep -q healthy
          docker exec sim python -c "import json; a = json.load(open('/data/fcm-service-account.json')); assert a['type'] == 'service_account', a"

  keycloak-realms:
    name: Keycloak · realm import
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - name: Import both realms into a throwaway Keycloak
        run: |
          docker run -d --name kc -p 9000:9000 \
            -e KC_HEALTH_ENABLED=true -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/infra/keycloak/realms:/opt/keycloak/data/import:ro" \
            keycloak/keycloak:26.3@sha256:357829ec7c4693397533035092ad13b0644bcc95ded311f33a3738c4d9e9bdba start-dev --import-realm
          for i in $(seq 1 60); do
            if curl -fs http://localhost:9000/health/ready >/dev/null; then break; fi
            sleep 3
          done
          docker logs kc 2>&1 | tee kc.log | tail -20
          grep -q "Realm 'ehimaya-public' imported" kc.log
          grep -q "Realm 'ehimaya-staff' imported" kc.log

  ai:
    name: AI · lint, types, tests
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: services/ai
    env:
      AI_SERVICE_TOKEN: ci-only-token-ci-only-token-0001
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Tests
        run: uv run pytest -q

  ai-images:
    name: AI · container images
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t ehimaya/ai:ci services/ai
      - run: docker build --target models -t ehimaya/ai-models:ci services/ai

  ai-models:
    name: AI · real models
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    env:
      MODELS: /home/runner/ai-models
      OLLAMA_DIR: /home/runner/ollama
      SAMPLES: /home/runner/samples
      AI_SERVICE_TOKEN: ci-only-token-ci-only-token-0001
      AI_OLLAMA_URL: http://localhost:11434
      AI_LLM_MODEL: qwen3:1.7b
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the models
        # Hosted runners only: on a self-hosted runner (vars.RUNNER) these are the owner's own directories.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Restore models
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/ai-models
            /home/runner/ollama
          key: ai-models-ci-${{ hashFiles('services/ai/models/fetch_models.py', 'services/ai/models/requirements.txt') }}

      - name: Start Ollama
        run: |
          mkdir -p "$OLLAMA_DIR"
          docker run -d --name ollama -p 11434:11434 -v "$OLLAMA_DIR:/root/.ollama" ollama/ollama:0.40.1@sha256:69f27594d8127cb43db1edcafa5e2d3cd8f88bdbc54a2cf3ceb11b8d138a24b1
          for i in $(seq 1 30); do curl -fs http://localhost:11434/api/tags >/dev/null && break; sleep 2; done

      - name: Download, convert and check the models (profile ci)
        run: |
          python -m venv /tmp/convert
          /tmp/convert/bin/pip install -q --extra-index-url https://download.pytorch.org/whl/cpu -r services/ai/models/requirements.txt
          /tmp/convert/bin/python services/ai/models/fetch_models.py --profile ci --out "$MODELS" --ollama "$AI_OLLAMA_URL"

      - name: Speech samples (espeak-ng)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q espeak-ng
          mkdir -p "$SAMPLES"
          espeak-ng -v fr -s 115 -w "$SAMPLES/fr.wav" "Bonjour, il y a un incendie dans la forêt près de la maison."
          espeak-ng -v en -s 140 -w "$SAMPLES/en.wav" "Hello, there is a fire in the building and two people are trapped."
          espeak-ng -v ar -s 130 -w "$SAMPLES/ar.wav" "يوجد حريق كبير في الغابة قرب الطريق"
          head -c 20000 /dev/urandom > "$SAMPLES/garbage.wav"

      - name: Tests against the real models
        working-directory: services/ai
        run: |
          uv sync --locked
          AI_MODELS_DIR="$MODELS" AI_TEST_AUDIO_DIR="$SAMPLES" uv run pytest -o addopts="" -m models -v -s

      - name: API ↔ AI service contract
        run: |
          cd services/ai
          AI_MODELS_DIR="$MODELS" AI_MEDIA_URL_PREFIX=http://127.0.0.1:8099/ uv run uvicorn app.main:app --port 8100 &
          (cd "$SAMPLES" && python -m http.server 8099 --bind 127.0.0.1 &)
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8100/health/live >/dev/null && break; sleep 1; done
          cd ../api && uv sync --locked
          DATABASE_URL=postgresql+asyncpg://unused:unused@localhost/unused \
          ANON_PSEUDONYM_SECRET=ci-only-secret-ci-only-secret-ci-only-01 \
          FIELD_ENCRYPTION_KEY=Y2ktb25seS1rZXktY2ktb25seS1rZXktY2ktb25seTE= \
          PYTHONPATH="$PWD" uv run python ../ai/tests/api_contract_check.py http://127.0.0.1:8100 "$AI_SERVICE_TOKEN" http://127.0.0.1:8099/fr.wav

      - name: Make the model cache readable
        if: always()
        run: sudo chown -R "$(id -u)" "$OLLAMA_DIR" || true

  vision:
    name: Vision · lint, types, tests
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: services/vision
    env:
      VISION_API_TOKEN: ci-only-token-ci-only-token-0001
      VISION_CALLBACK_TOKEN: ci-only-callback-ci-only-callback-01
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Tests
        run: uv run pytest -q

  # Real detectors (ONNX files pinned by SHA-256, cached), the held-out evaluation sample (pinned images, cached) and
  # the two container images working together: models job fills a volume, the service starts healthy on it.
  vision-models:
    name: Vision · real models
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    env:
      MODELS: /home/runner/vision-models
      VISION_API_TOKEN: ci-only-token-ci-only-token-0001
      VISION_CALLBACK_TOKEN: ci-only-callback-ci-only-callback-01
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Restore models
        uses: actions/cache@v4
        with:
          path: /home/runner/vision-models
          key: vision-models-${{ hashFiles('services/vision/models/fetch_models.py', 'services/vision/models/weights/**') }}

      - name: Restore evaluation images
        uses: actions/cache@v4
        with:
          path: services/vision/eval/cache
          key: vision-eval-${{ hashFiles('services/vision/eval/samples.json') }}

      - name: Download and check the models
        run: python3 services/vision/models/fetch_models.py --out "$MODELS"

      - name: Tests against the real models
        working-directory: services/vision
        run: |
          uv sync --locked
          VISION_MODELS_DIR="$MODELS" uv run pytest -o addopts="" -m models -v -s

      - name: Evaluation on the held-out sample (frame-level precision/recall, CPU latency)
        working-directory: services/vision
        run: VISION_MODELS_DIR="$MODELS" uv run python eval/evaluate.py --threads 2 --json eval/results.json

      - name: Images work together (models job → volume → healthy service)
        run: |
          docker build --target models -t ehimaya/vision-models:ci services/vision
          docker build --target runtime -t ehimaya/vision:ci services/vision
          docker volume create visionmodels
          docker run --rm -v visionmodels:/models ehimaya/vision-models:ci
          docker run -d --name vision -v visionmodels:/models:ro \
            -e VISION_API_TOKEN -e VISION_CALLBACK_TOKEN -p 127.0.0.1:8100:8100 ehimaya/vision:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' vision)" = healthy ] && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8100/healthz | tee health.json
          python3 -c "import json; h=json.load(open('health.json')); assert h['status'] == 'ok', h"
          curl -fsS -H "Authorization: Bearer $VISION_API_TOKEN" http://127.0.0.1:8100/v1/model
          SAMPLE=$(python3 -c "import json; print(json.load(open('services/vision/eval/samples.json'))['samples'][0]['id'])")
          curl -fsS -H "Authorization: Bearer $VISION_API_TOKEN" -F "image=@services/vision/eval/cache/$SAMPLE.jpg;type=image/jpeg" \
            http://127.0.0.1:8100/v1/detect

      - name: Logs on failure
        if: failure()
        run: docker logs vision || true

  stack:
    name: Stack · compose smoke test
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate a throwaway .env
        run: |
          cp .env.example .env
          sed -i "s|^FIELD_ENCRYPTION_KEY=.*|FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          sed -i "s|^ANON_PSEUDONYM_SECRET=.*|ANON_PSEUDONYM_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^TUSD_HOOK_SECRET=.*|TUSD_HOOK_SECRET=$(openssl rand -hex 24)|" .env
          sed -i "s|^AI_SERVICE_TOKEN=.*|AI_SERVICE_TOKEN=$(openssl rand -hex 24)|" .env
          sed -i "s|^CERTIFICATE_SIGNING_KEY=.*|CERTIFICATE_SIGNING_KEY=$(openssl rand -base64 32)|" .env
          sed -i "s|^MEDIAMTX_HOOK_TOKEN=.*|MEDIAMTX_HOOK_TOKEN=$(openssl rand -hex 24)|" .env
          sed -i "s|^MEDIAMTX_API_PASSWORD=.*|MEDIAMTX_API_PASSWORD=$(openssl rand -hex 24)|" .env
          sed -i "s|^TELEPHONY_ARI_PASSWORD=.*|TELEPHONY_ARI_PASSWORD=$(openssl rand -hex 24)|" .env
          sed -i "s|^TELEPHONY_SIM_PASSWORD=.*|TELEPHONY_SIM_PASSWORD=$(openssl rand -hex 24)|" .env
          sed -i "s|^TELEPHONY_SIM_TOKEN=.*|TELEPHONY_SIM_TOKEN=$(openssl rand -hex 24)|" .env
          sed -i "s|^SMS_INBOUND_SECRET=.*|SMS_INBOUND_SECRET=$(openssl rand -hex 32)|" .env
      - name: Production overlay renders (Caddy, Keycloak start, no host ports but 80/443, streaming and telephony)
        run: |
          cat > prod.env <<EOF
          API_HOST=api.ehimaya.test
          DASHBOARD_HOST=dashboard.ehimaya.test
          PORTAL_HOST=portal.ehimaya.test
          AUTH_HOST=auth.ehimaya.test
          MEDIA_HOST=media.ehimaya.test
          EHIMAYA_DB_RUNTIME_PASSWORD=$(openssl rand -hex 24)
          TUSD_CORS_ORIGIN_REGEX=^https://(dashboard|portal)\.ehimaya\.test\$
          EOF
          cat .env prod.env > prod-full.env
          docker compose --env-file prod-full.env -f infra/compose.yml -f infra/compose.prod.yml config > prod.yml
          python3 -c "import yaml; s=yaml.safe_load(open('prod.yml'))['services']; p={n:sorted(str(x.get('published'))+'/'+x.get('protocol','tcp') for x in v.get('ports',[])) for n,v in s.items() if v.get('ports')}; print(p); assert set(p)=={'caddy','mediamtx','telephony'}, p; assert p['mediamtx']==['1935/tcp','8189/udp','8554/tcp'], p; assert set(p['telephony'])=={'5060/tcp','5060/udp','5061/tcp'}|{f'{n}/udp' for n in range(10000,10100)}, p['telephony']; assert all('8088' not in x for x in p['telephony']); assert 'notify-sim' not in s and 'mailpit' not in s and 'stream-sim' not in s and 'call-sim' not in s; e=s['worker']['environment']; assert e['TELEPHONY_RECORDING_ENABLED']=='false' and e['TELEPHONY_SIM_TOKEN']=='' and e['TELEPHONY_WS_PUBLIC_URL']=='wss://api.ehimaya.test/telephony/ws', e"
      - name: Terrain one-shot service renders (opt-in profile)
        run: docker compose --env-file .env -f infra/compose.yml --profile terrain config -q
      - name: Start the stack
        run: docker compose --env-file .env -f infra/compose.yml up -d --build
      - name: Anonymous report, resumable upload, integrity check, notify-sim health
        run: python3 infra/smoke/smoke_test.py
      - name: Certificate PDFs render in the API image (Arabic shaping, fonts)
        run: |
          docker compose --env-file .env -f infra/compose.yml exec -T api python -c "
          from weasyprint import HTML
          pdf = HTML(string='<html dir=rtl><body><h1>شهادة السلامة الرقمية</h1><p>Certificat</p></body></html>').write_pdf()
          assert pdf.startswith(b'%PDF') and len(pdf) > 2000, len(pdf)
          print('pdf ok', len(pdf))"
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env -f infra/compose.yml logs --tail=200
