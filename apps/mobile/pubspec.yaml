name: ehimaya
description: "ء-حماية (e-Himaya) — national emergency reporting app for the Tunisian civil protection."
publish_to: 'none'

version: 0.2.0+1

environment:
  sdk: ">=3.13.5 <4.0.0"
  flutter: ">=3.47.7"

# Every dependency is pinned to an exact version (see apps/mobile/README.md).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  connectivity_plus: 7.3.2
  crypto: 3.0.7
  dio: 5.11.1
  drift: 2.35.2
  flutter_appauth: 12.1.0
  flutter_map: 8.3.2
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  geolocator: 14.0.1
  go_router: 18.1.0
  image_picker: 1.2.4
  intl: 0.20.3
  just_audio: 0.10.6
  latlong2: 0.10.1
  logging: 1.3.0
  path: 1.9.1
  path_provider: 2.1.6
  record: 7.1.2
  shared_preferences: 2.5.6
  sqlite3: 3.7.1
  url_launcher: 6.3.3
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.16.2
  drift_dev: 2.35.1
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true

# SQLCipher for the encrypted offline queue (NFR-04). package:sqlite3 3.x bundles SQLite through
# build hooks; on Android and iOS we select its SQLCipher build. Host builds (flutter test on
# Linux/macOS CI) use the system SQLite so tests never download native binaries.
hooks:
  user_defines:
    sqlite3:
      source:
        android: sqlcipher
        ios: sqlcipher
        default: system
