; Asterisk REST Interface: one user, the API (credentials TELEPHONY_ARI_USER / TELEPHONY_ARI_PASSWORD).
[general]
enabled = yes
pretty = no
; Server-to-server only: no browser origin may call ARI.
allowed_origins =
; Variables carried in every event about a channel (who placed the call, the number dialled on the trunk).
channelvars = EH_SOURCE,EH_DID,EH_CALL_ID
websocket_write_timeout = 1000

[@@TELEPHONY_ARI_USER@@]
type = user
read_only = no
password = @@TELEPHONY_ARI_PASSWORD@@
password_format = plain
