; ء-حماية / e-Himaya — dialplan (architecture §8, ADR-10, docs/telephony.md).
;
; The emergency path never waits for the API: 8000 answers, records, announces the call to the API with a
; UserEvent (read over the ARI WebSocket) and queues it. If the API is down, calls are still queued and recorded;
; the API picks the recordings up later. The API drives everything else (operator queue membership, scenario 2
; transfer, outbound calls, crisis rooms) through ARI: originated channels and Local control channels into
; [ehimaya-control], a context no SIP endpoint can reach.
;
; Patterns: a lowercase n, x or z after "_" is a wildcard, so literal letters n are written [n] (_co[n]f-…).
;
; Events (ChannelUserevent "EhimayaCall", fields: state, call, ...): ringing, answered, queue_timeout, dialing,
; remote_answered, dial_failed, transferring, transfer_failed, transfer_disabled.

[general]
static = yes
writeprotect = yes
clearglobalvars = yes

[globals]
EH_REC_DIR = /var/spool/asterisk/ehimaya
; 1 = calls are recorded (MixMonitor) after the recorded-call notice; 0 = never recorded (TELEPHONY_RECORDING_ENABLED).
; Production requires the INPDP declaration of the processing first (docs/telephony.md, legal point L04).
EH_RECORDING = @@EH_RECORDING@@
EH_QUEUE_TIMEOUT = @@TELEPHONY_QUEUE_TIMEOUT_S@@
; 1 when a trunk is configured; outbound calls leave through EH_OUTBOUND (trunk, call-sim or none).
EH_TRUNK = @@EH_TRUNK@@
EH_OUTBOUND = @@EH_OUTBOUND@@
; Number format the trunk expects: e164 (+216XXXXXXXX), 00 (00216XXXXXXXX) or national (XXXXXXXX).
EH_NUMBER_FORMAT = @@TELEPHONY_TRUNK_NUMBER_FORMAT@@
EH_PRESENTED_NUMBER = @@TELEPHONY_TRUNK_CALLER_ID@@
; Scenario 2 (ADR-10): blind transfer to 198 through the trunk, only with TELEPHONY_TRANSFER_198_ENABLED=true.
EH_TRANSFER_198 = @@EH_TRANSFER_198@@
EH_TRUNK_198 = @@TELEPHONY_TRUNK_198_NUMBER@@

; ---------------------------------------------------------------- public entry: 8000

[ehimaya-entry]
exten => 8000,1,NoOp(e-Himaya public entry)
 same => n,Set(__EH_CALL_ID=${UNIQUEID})
 same => n,Set(__EH_SOURCE=${IF($["${EH_SOURCE}" = ""]?unknown:${EH_SOURCE})})
 same => n,Set(EH_RETRIES=0)
 same => n,Set(CHANNEL(language)=ar)
 same => n,Answer()
 same => n,UserEvent(EhimayaCall,state: ringing,call: ${UNIQUEID},source: ${EH_SOURCE},did: ${EH_DID},recording: ${EH_RECORDING})
 ; Recorded-call notice (Arabic, then French) before anything is recorded or queued (legal point L04). The files are
 ; generated at build time; replace them with professional recordings by mounting files of the same name.
 same => n,Playback(ehimaya/notice-ar&ehimaya/notice-fr)
 same => n,ExecIf($[${EH_RECORDING}]?MixMonitor(${EH_REC_DIR}/${UNIQUEID}.wav))
 same => n,ExecIf($[${STAT(e,/var/lib/asterisk/sounds/ehimaya/welcome.wav)}]?Playback(ehimaya/welcome))
 same => n(queue),Queue(operators,rb(ehimaya-predial^s^1),,,${EH_QUEUE_TIMEOUT},,,ehimaya-member-answered)
 same => n,UserEvent(EhimayaCall,state: queue_timeout,call: ${UNIQUEID},status: ${QUEUESTATUS})
 ; Nobody answered: tell the caller to dial 198 directly (scenario 0), then keep waiting once more.
 same => n,ExecIf($[${STAT(e,/var/lib/asterisk/sounds/ehimaya/busy.wav)}]?Playback(ehimaya/busy))
 same => n,Set(EH_RETRIES=$[${EH_RETRIES} + 1])
 same => n,GotoIf($[${EH_RETRIES} < 2]?queue)
 same => n,Hangup(34)

; Back into the queue (failed transfer, refused transfer).
exten => requeue,1,Goto(ehimaya-entry,8000,queue)

; Run on each operator's channel before the queue rings it (Queue b() option): SIP headers the dashboard softphone
; uses to pair the INVITE with the call (calls.id, set on the caller's channel by the API when the call started).
[ehimaya-predial]
exten => s,1,ExecIf($["${EH_CALL_UUID}" != ""]?Set(PJSIP_HEADER(add,X-EHimaya-Call-Id)=${EH_CALL_UUID}))
 same => n,Set(PJSIP_HEADER(add,X-EHimaya-Queue)=operators)
 same => n,Return()

; Run on the operator's channel when it answers a queued call (Queue gosub argument).
[ehimaya-member-answered]
exten => s,1,UserEvent(EhimayaCall,state: answered,call: ${EH_CALL_ID},endpoint: ${CHANNEL(endpoint)})
 same => n,Return()

; ---------------------------------------------------------------- the trunk: every DID of the platform → 8000

[ehimaya-trunk-in]
exten => _X.,1,Set(__EH_SOURCE=trunk)
 same => n,Set(__EH_DID=${FILTER(0-9,${EXTEN})})
 same => n,Goto(ehimaya-entry,8000,1)
exten => _+X.,1,Goto(ehimaya-trunk-in,${EXTEN:1},1)
exten => s,1,Goto(ehimaya-trunk-in,8000,1)

; ---------------------------------------------------------------- operators' softphones

[ehimaya-operators]
; An operator may dial a crisis room; every other number goes through the API (POST /api/v1/staff/calls/dial:
; validated Tunisian numbers, audited), never straight from the softphone.
exten => _co[n]f-XXXXXXXX,1,Goto(ehimaya-conference,${EXTEN},1)
exten => _X.,1,Hangup(21)
exten => _+X.,1,Hangup(21)

; ---------------------------------------------------------------- outbound (originated by the API)

[ehimaya-outbound]
; The operator's leg answers first, then the number is dialled. The extension is always 216XXXXXXXX (checked by
; the API and again here).
exten => _216[2-9]XXXXXXX,1,NoOp(e-Himaya outbound)
 same => n,Set(__EH_CALL_ID=${UNIQUEID})
 ; Recorded (when enabled) only from the called party's answer, after it heard the notice (ehimaya-remote-answered).
 same => n,UserEvent(EhimayaCall,state: dialing,call: ${UNIQUEID},recording: ${EH_RECORDING})
 same => n,GotoIf($["${EH_OUTBOUND}" = "none"]?unavailable)
 same => n,Set(EH_DIAL=${IF($["${EH_NUMBER_FORMAT}" = "national"]?${EXTEN:3}:${IF($["${EH_NUMBER_FORMAT}" = "00"]?00${EXTEN}:+${EXTEN})})})
 same => n,ExecIf($["${EH_PRESENTED_NUMBER}" != ""]?Set(CALLERID(num)=${EH_PRESENTED_NUMBER}))
 same => n,Dial(PJSIP/${EH_DIAL}@${EH_OUTBOUND},60,U(ehimaya-remote-answered))
 same => n,UserEvent(EhimayaCall,state: dial_failed,call: ${UNIQUEID},status: ${DIALSTATUS})
 same => n,Hangup()
 same => n(unavailable),UserEvent(EhimayaCall,state: dial_failed,call: ${UNIQUEID},status: NO_ROUTE)
 same => n,Hangup(3)

[ehimaya-remote-answered]
; Runs on the called party's channel once it answers: the recorded-call notice, then the conversation.
exten => s,1,UserEvent(EhimayaCall,state: remote_answered,call: ${EH_CALL_ID})
 same => n,ExecIf($[${EH_RECORDING}]?Playback(ehimaya/notice-ar&ehimaya/notice-fr))
 same => n,ExecIf($[${EH_RECORDING}]?MixMonitor(${EH_REC_DIR}/${EH_CALL_ID}.wav))
 same => n,Return()

[ehimaya-invite]
; Half of the Local channel the API originates to invite someone into a crisis room
; (POST /api/v1/staff/conferences/{id}/invite); the other half joins [ehimaya-conference]. Not recorded: the room
; is a coordination channel between responders, not a citizen call.
exten => _216[2-9]XXXXXXX,1,GotoIf($["${EH_OUTBOUND}" = "none"]?unavailable)
 same => n,Set(EH_DIAL=${IF($["${EH_NUMBER_FORMAT}" = "national"]?${EXTEN:3}:${IF($["${EH_NUMBER_FORMAT}" = "00"]?00${EXTEN}:+${EXTEN})})})
 same => n,ExecIf($["${EH_PRESENTED_NUMBER}" != ""]?Set(CALLERID(num)=${EH_PRESENTED_NUMBER}))
 same => n,Dial(PJSIP/${EH_DIAL}@${EH_OUTBOUND},60)
 same => n,Hangup()
 same => n(unavailable),Hangup(3)

; ---------------------------------------------------------------- scenario 2: transfer to 198

[ehimaya-transfer]
; The caller is redirected here by [ehimaya-control] (POST /api/v1/staff/calls/{id}/transfer-198). The API refuses
; the request unless the transfer is enabled and a trunk exists; the dialplan checks both again.
exten => 198,1,GotoIf($[${EH_TRANSFER_198} & ${EH_TRUNK}]?dial)
 same => n,UserEvent(EhimayaCall,state: transfer_disabled,call: ${UNIQUEID})
 same => n,Goto(ehimaya-entry,requeue,1)
 same => n(dial),UserEvent(EhimayaCall,state: transferring,call: ${UNIQUEID},to: 198)
 same => n,Dial(PJSIP/${EH_TRUNK_198}@trunk,60)
 same => n,UserEvent(EhimayaCall,state: transfer_failed,call: ${UNIQUEID},status: ${DIALSTATUS})
 same => n,Goto(ehimaya-entry,requeue,1)

; ---------------------------------------------------------------- crisis rooms (ConfBridge)

[ehimaya-conference]
exten => _co[n]f-XXXXXXXX,1,Answer()
 same => n,UserEvent(EhimayaConference,state: join,room: ${EXTEN:5})
 same => n,ConfBridge(${EXTEN:5},ehimaya_room,ehimaya_user,ehimaya_menu)
 same => n,Hangup()

; ---------------------------------------------------------------- control channels (API only)

[ehimaya-control]
; Reached only through Local channels the API originates over ARI (POST /ari/channels, endpoint
; Local/<action>@ehimaya-control): no endpoint has this context and no context includes it.
exten => _member-add-.,1,Set(EH_EP=${EXTEN:11})
 same => n,GotoIf($[${REGEX("^op-[0-9a-f]{12}$" ${EH_EP})}]?:done)
 same => n,AddQueueMember(operators,PJSIP/${EH_EP},,,${EH_EP},PJSIP/${EH_EP})
 same => n(done),Hangup()
exten => _member-del-.,1,Set(EH_EP=${EXTEN:11})
 same => n,GotoIf($[${REGEX("^op-[0-9a-f]{12}$" ${EH_EP})}]?:done)
 same => n,RemoveQueueMember(operators,PJSIP/${EH_EP})
 same => n(done),Hangup()
; Blind transfer of a caller (its channel id) to 198.
exten => _tra[n]sfer-.,1,Set(EH_TARGET=${EXTEN:9})
 same => n,GotoIf($[${REGEX("^[A-Za-z0-9._-]{1,64}$" ${EH_TARGET})}]?:done)
 same => n,ChannelRedirect(${EH_TARGET},ehimaya-transfer,198,1)
 same => n(done),Hangup()
; End a crisis room: every participant is disconnected.
exten => _co[n]fkick-XXXXXXXX,1,ConfKick(${EXTEN:9},all)
 same => n,Hangup()
; Where the originating half of a control channel would go (it never answers).
exten => done,1,Hangup()

#tryinclude extensions_sim.conf
