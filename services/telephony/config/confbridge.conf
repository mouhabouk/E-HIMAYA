; Crisis rooms (POST /api/v1/staff/incidents/{id}/conference): operators join by dialling conf-<room> from the
; dashboard softphone; outside participants are called into the room by the API. No sound files are shipped:
; announcements are off.
[general]

[ehimaya_room]
type = bridge
max_members = 50
mixing_interval = 20
internal_sample_rate = auto
record_conference = no

[ehimaya_user]
type = user
quiet = yes
announce_user_count = no
announce_only_user = no
dsp_drop_silence = yes
dtmf_passthrough = no

[ehimaya_menu]
type = menu
