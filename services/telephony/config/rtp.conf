; Media ports: TELEPHONY_RTP_START..TELEPHONY_RTP_END (UDP) must be published and open in the firewall
; (docs/telephony.md). WebRTC (ICE) announces TELEPHONY_EXTERNAL_HOST instead of the container address.
[general]
rtpstart = @@TELEPHONY_RTP_START@@
rtpend = @@TELEPHONY_RTP_END@@
icesupport = yes
strictrtp = seqno
probation = 4
rtcpinterval = 5000

[ice_host_candidates]
@@EH_ICE_HOST_CANDIDATE@@
