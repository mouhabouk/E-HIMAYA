; Operator endpoints are created over ARI (PUT /ari/asterisk/config/dynamic/res_pjsip/...) when the dashboard asks
; for short-lived SIP credentials, and deleted when they expire. They live in memory: an Asterisk restart drops them
; and the softphone asks the API for new credentials. Static objects (transports, trunk, simulator) stay in the files.
[res_pjsip]
endpoint = config,pjsip.conf,criteria=type=endpoint
endpoint = memory
auth = config,pjsip.conf,criteria=type=auth
auth = memory
aor = config,pjsip.conf,criteria=type=aor
aor = memory
