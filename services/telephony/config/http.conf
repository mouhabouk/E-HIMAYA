; HTTP server of Asterisk on the internal network: ARI (/ari, the API only) and SIP over WebSocket (/ws, the
; dashboard softphones). Production: Caddy routes only https://API_HOST/telephony/ws to /ws (infra/caddy/Caddyfile);
; /ari is never published.
[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
servername = e-Himaya
enablestatic = no
sessionlimit = 500
session_inactivity = 30000
session_keep_alive = 15000
