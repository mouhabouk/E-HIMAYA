; Queue "operators": every 8000 call waits here until an operator's dashboard softphone answers. Members are the
; operators' WebRTC endpoints, added by the API when it issues their SIP credentials (control channel, see
; extensions.conf [ehimaya-control]) and removed when the credentials expire.
[general]
persistentmembers = no
autofill = yes
shared_lastcall = yes
log_membername_as_agent = yes

[operators]
; Ring every free operator at once: the first to answer takes the call (emergency line, no rotation needed).
strategy = ringall
timeout = 20
retry = 2
wrapuptime = 5
ringinuse = no
; Callers wait even when no operator is connected (after the queue timeout they are told to call 198).
joinempty = yes
leavewhenempty = no
announce-frequency = 0
announce-holdtime = no
periodic-announce-frequency = 0
reportholdtime = no
setinterfacevar = yes
timeoutpriority = app
