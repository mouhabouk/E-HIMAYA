; ء-حماية / e-Himaya — PJSIP. Optional parts are rendered by docker-entrypoint.sh only when configured:
;   pjsip_tls.conf    SIP over TLS (5061) when /etc/ehimaya-asterisk/certs/tls.crt and tls.key are mounted
;   pjsip_trunk.conf  the operator's SIP trunk when TELEPHONY_TRUNK_HOST is set (scenarios 1-2 from the PSTN)
;   pjsip_sim.conf    SIMULATION: the call-sim endpoint when TELEPHONY_SIM_PASSWORD is set (never in production)

[global]
type = global
user_agent = e-Himaya
endpoint_identifier_order = ip,username
; Unknown requests get the same answer as a wrong password (no account enumeration).
default_realm = ehimaya

[system]
type = system
timer_t1 = 500

; ---------------------------------------------------------------- transports

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
local_net = @@TELEPHONY_LOCAL_NET_1@@
local_net = @@TELEPHONY_LOCAL_NET_2@@
local_net = @@TELEPHONY_LOCAL_NET_3@@
external_media_address = @@TELEPHONY_EXTERNAL_HOST@@
external_signaling_address = @@TELEPHONY_EXTERNAL_HOST@@

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060
local_net = @@TELEPHONY_LOCAL_NET_1@@
local_net = @@TELEPHONY_LOCAL_NET_2@@
local_net = @@TELEPHONY_LOCAL_NET_3@@
external_media_address = @@TELEPHONY_EXTERNAL_HOST@@
external_signaling_address = @@TELEPHONY_EXTERNAL_HOST@@

; SIP over WebSocket for the dashboard softphones (served by the HTTP server on /ws; TLS is terminated by Caddy in
; production, so the browser always uses wss://).
[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0

#tryinclude pjsip_tls.conf

; ---------------------------------------------------------------- operators (WebRTC softphones)
; Template of the endpoints the API creates over ARI for each operator (POST /api/v1/staff/telephony/credentials).
; The API pushes exactly these values (services/api/app/modules/telephony/ari.py, OPERATOR_ENDPOINT_FIELDS): keep
; both in step. Endpoint, aor and auth are named op-<12 hex>; the password is random and lives as long as the
; credentials (TELEPHONY_CREDENTIAL_TTL_S).
[operator-endpoint](!)
type = endpoint
context = ehimaya-operators
disallow = all
allow = g722,ulaw,alaw
; webrtc = yes: AVPF, DTLS-SRTP with an auto-generated certificate, ICE, rtcp-mux, received transport.
webrtc = yes
dtls_auto_generate_cert = yes
transport = transport-wss
direct_media = no
device_state_busy_at = 1
; Transfers only through the API (audited): no SIP REFER from the softphone.
allow_transfer = no
allow_subscribe = no
rtp_timeout = 120
send_pai = yes
trust_id_inbound = no

[operator-aor](!)
type = aor
max_contacts = 1
remove_existing = yes
default_expiration = 300
maximum_expiration = 3600

[operator-auth](!)
type = auth
auth_type = userpass

#tryinclude pjsip_trunk.conf
#tryinclude pjsip_sim.conf
