; ┏━━ SIMULATION ━━ scripted calls of call-sim (driven by call-sim.sh with "channel originate"):
; ┃   Local/call@sim-dial sets a fictitious Tunisian caller number and calls 8000; once an operator (or the queue)
; ┃   answers, the other half plays the generated prompt, waits, and hangs up.
; ┃ PRODUCTION: not deployed.
; ┗━━━━━━━━━━━━━━━━
[general]
static = yes
writeprotect = yes

[sim-dial]
exten => call,1,Set(CALLERID(all)="SIM" <+21620001${EPOCH:-3}>)
 same => n,Dial(PJSIP/8000@ehimaya,90)
 same => n,Hangup()

[sim-caller]
exten => play,1,Wait(1)
 same => n,Playback(ehimaya-sim/prompt)
 same => n,Wait(${IF($["${EH_TALK_S}" = ""]?20:${EH_TALK_S})})
 same => n,Playback(ehimaya-sim/prompt)
 same => n,Hangup()

; Calls from the platform (no trunk in development): answer and play the prompt.
[sim-callee]
exten => _X.,1,Answer()
 same => n,Wait(1)
 same => n,Playback(ehimaya-sim/prompt)
 same => n,Wait(30)
 same => n,Hangup()
exten => _+X.,1,Goto(sim-callee,${EXTEN:1},1)
