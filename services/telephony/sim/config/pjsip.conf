; ┏━━ SIMULATION ━━ call-sim: calls 8000 on the telephony service as endpoint "call-sim", and answers the calls the
; ┃   platform places when no trunk is configured (contact from the map, crisis-room invitations).
; ┃ PRODUCTION: not deployed; the operator's SIP trunk plays both roles (docs/telephony.md).
; ┗━━━━━━━━━━━━━━━━
[global]
type = global
user_agent = e-Himaya call-sim
endpoint_identifier_order = ip,username

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[ehimaya-auth]
type = auth
auth_type = userpass
username = call-sim
password = @@TELEPHONY_SIM_PASSWORD@@

[ehimaya]
type = aor
contact = sip:@@CALL_SIM_TARGET@@:5060

[ehimaya]
type = endpoint
context = sim-callee
disallow = all
allow = ulaw,alaw
transport = transport-udp
outbound_auth = ehimaya-auth
aors = ehimaya
from_user = call-sim
direct_media = no
send_pai = yes

[ehimaya]
type = identify
endpoint = ehimaya
match = @@CALL_SIM_TARGET@@
