; ء-حماية / e-Himaya — Asterisk directories and options. Rendered by docker-entrypoint.sh into /run/asterisk/etc
; (tmpfs-friendly, mode 0600); placeholders (a variable name between double at signs) come from the environment (docs/telephony.md).
[directories]
astetcdir => /run/asterisk/etc
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
; Silence is sent while nobody speaks: recordings keep real time and NAT bindings stay open.
transmit_silence = yes
; The container runs as an unprivileged user already; no runuser/rungroup switch.
hideconnect = yes
; No maxload: an emergency call is never refused because the host is busy (calls queue instead).
