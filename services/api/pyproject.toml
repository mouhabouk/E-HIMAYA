[project]
name = "ehimaya-api"
version = "0.1.0"
description = "ء-حماية / e-Himaya — core backend API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.146.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy[asyncio]==2.1.5",
  "asyncpg==0.32.0",
  "alembic==1.20.0",
  "pydantic-settings==2.16.0",
  "geoalchemy2==0.20.0",
  "pgvector==0.5.1",
  "pyjwt[crypto]==2.15.1",
  "httpx==0.28.1",
  "redis==8.1.0",
  "nats-py==2.16.0",
  "structlog==26.1.0",
  "boto3==1.43.114",
  "cryptography==50.0.2",
  "weasyprint==70.0",
  "segno==1.6.6",
  "email-validator==2.3.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.1",
  "mypy==2.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "RUF012"]  # RUF012: SQLAlchemy __table_args__ idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"migrations/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]
