[project]
name = "ehimaya-api"
version = "0.1.0"
description = "ء-حماية / e-Himaya — core backend API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy[asyncio]==2.1.6",
  "asyncpg==0.32.0",
  "alembic==1.20.1",
  "pydantic-settings==2.16.1",
  "geoalchemy2==0.20.0",
  "pgvector==0.5.1",
  "pyjwt[crypto]==2.15.1",
  "httpx==0.28.1",
  "redis==8.1.0",
  "nats-py==2.16.0",
  "structlog==26.1.0",
  "boto3==1.43.118",
  "cryptography==50.0.2",
  "weasyprint==70.0",
  "segno==1.6.6",
  "email-validator==2.3.0",
  "prometheus-client==0.26.0",
  # ARI event stream (phase 7 telephony); already present through uvicorn[standard], pinned as a direct dependency.
  "websockets==17.3",
  # Spreadsheet exports of the reports repository (phase 8 analytics).
  "openpyxl==3.1.5",
  # Text of the intervention plans the local model reads into a task list (L5, AI2); pure Python, no network.
  "pypdf==6.21.4",
  # The drowning risk model kept in shadow beside the declared rules (L5, S3); trained on [SIM] data in the server.
  "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.2",
  "mypy==2.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "RUF012"]  # RUF012: SQLAlchemy __table_args__ idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"migrations/*" = ["E501"]
# Message texts in three languages read best unwrapped.
"app/modules/notify/templates.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]
