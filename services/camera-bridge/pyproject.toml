# Bridge of the fire-detecting cameras of an institution (Yamen 2026-11-01, docs/guides/camera-bridge.md): runs on a
# small computer of the institution's network, receives the cameras' own alarms (Hikvision, Dahua, generic HTTP) and
# relays them, signed, to the API. Python standard library only at run time.
[project]
name = "ehimaya-camera-bridge"
version = "0.1.0"
description = "ء-حماية / e-Himaya — bridge of the fire-detecting cameras of an institution"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.2",
  "mypy==2.4.0",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/"]
