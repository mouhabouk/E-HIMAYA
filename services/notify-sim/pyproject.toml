# ┏━━ SIMULATION ━━ channels simulator (FCM HTTP v1 + OAuth, Tunisian SMS gateway) for development and tests only
# ┃ PRODUCTION: not deployed; remove the notify-sim service from infra/compose.yml and configure the API with the real
# ┃   FCM_SERVICE_ACCOUNT / FCM_API_URL / SMS_HTTP_URL / SMS_HTTP_TOKEN (docs/api/notify-sim.md).
# ┗━━━━━━━━━━━━━━━━
[project]
name = "ehimaya-notify-sim"
version = "0.1.0"
description = "ء-حماية / e-Himaya — SIMULATION: Firebase Cloud Messaging and SMS gateway emulator (dev/test only)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.146.0",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.16.0",
  "pyjwt[crypto]==2.15.1",
  "cryptography==50.0.2",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.17.1",
  "mypy==2.4.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["tests/"]
